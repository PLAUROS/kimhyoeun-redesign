/* 바텀시트: 손잡이를 끌거나 눌러서 내리고 올려요. 주 버튼은 시트 밖에 있어서 접어도 그대로 보여요 */
let sheetDrag=null, sheetJustDragged=false, sheetOpenT=0;
function sheetPeek(){ // 접었을 때: 손잡이와 첫 줄까지만 보여요. 목적지 고르기는 검색칸까지 남겨요
  const sh=$('sheet'), keep=sh.querySelector('.tx-search-wrap'), first=keep||sh.querySelector('.grab+*');
  if(!first) return 44;
  const h=Math.round(first.getBoundingClientRect().bottom-sh.getBoundingClientRect().top+8);
  return keep ? h : Math.min(h,96);
}
function markSheetBody(down,peek){ // 가려진 내용에는 키보드 초점이 가지 않게 해요
  const sh=$('sheet'), top=sh.getBoundingClientRect().top;
  [...sh.children].forEach(el=>{ if(el.classList.contains('grab')) return; el.inert=!!down&&(el.getBoundingClientRect().bottom-top>peek+1); });
}
function applySheet(){
  const sh=$('sheet'); clearTimeout(sheetOpenT);
  sh.classList.toggle('down',!!S.sheetDown); sh.classList.remove('dragging');
  const peek=S.sheetDown?sheetPeek():0;
  sh.style.maxHeight = S.sheetDown ? peek+'px' : '';
  markSheetBody(S.sheetDown,peek);
}
function setSheet(down){
  const sh=$('sheet'), a=$('area'), from=sh.getBoundingClientRect().height;
  S.sheetDown=down; a.scrollTop=0; clearTimeout(sheetOpenT); MapCtl.hold();
  const g=sh.querySelector('.grab'); if(g){ g.setAttribute('aria-expanded',String(!down)); g.setAttribute('aria-label',grabLabel(down)); }
  sh.classList.remove('dragging');
  const peek=sheetPeek(); markSheetBody(down,peek);
  if(down){ sh.classList.add('down'); sh.style.maxHeight=from+'px'; void sh.offsetHeight; sh.style.maxHeight=peek+'px'; return; }
  sh.style.maxHeight=from+'px'; void sh.offsetHeight; sh.style.maxHeight=sh.scrollHeight+'px';
  sheetOpenT=setTimeout(()=>{ if(!S.sheetDown){ sh.style.maxHeight=''; sh.classList.remove('down'); } },400); // 다 펴지면 내용 길이에 맡겨요
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.grab'); if(!g||sheetDrag||(e.button&&e.pointerType==='mouse')) return;
  const sh=$('sheet');
  sheetDrag={id:e.pointerId,y:e.clientY,start:sh.getBoundingClientRect().height,peek:sheetPeek(),full:sh.scrollHeight,moved:false};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove',e=>{
  const d=sheetDrag; if(!d||e.pointerId!==d.id) return;
  const dy=e.clientY-d.y; if(!d.moved&&Math.abs(dy)<6) return;
  const sh=$('sheet');
  MapCtl.hold();
  if(!d.moved){ d.moved=true; clearTimeout(sheetOpenT); $('area').scrollTop=0; sh.classList.add('dragging'); }
  sh.style.maxHeight=Math.max(d.peek,Math.min(d.full,d.start-dy))+'px';
});
function endSheetDrag(e){
  const d=sheetDrag; if(!d||e.pointerId!==d.id) return; sheetDrag=null; setTimeout(flushLive,450); // 시트가 자리를 잡은 뒤에 반영해요
 
  if(!d.moved) return;
  sheetJustDragged=true; setTimeout(()=>{sheetJustDragged=false},0);
  const h=$('sheet').getBoundingClientRect().height, moved=d.start-h;
  // 조금만 움직여도 그 방향으로 접히거나 펴져요
  setSheet(Math.abs(moved)<24 ? !!S.sheetDown : moved>0);
}
document.addEventListener('pointerup',endSheetDrag);
document.addEventListener('pointercancel',endSheetDrag);

/* =====================================================================
   10. 진행
   ===================================================================== */
let lastStepAt=-1e9; // 빠른 두 번 탭이 다음 화면의 같은 자리 버튼을 누르지 않게 해요
const haltStep=()=>{ clearTimers(); stopAnim(); lastStepAt=performance.now(); };
const markGuide=()=>{ if(S.mode==='practice'&&PREF.guide&&!WAIT[S.step]) S.sk[SKILL_OF[S.step]].g=1; };
const tickStep=()=>{ const now=flowNow(); if(S.stepAt!=null&&!WAIT[S.step]) S.sk[SKILL_OF[S.step]].ms+=now-S.stepAt; S.stepAt=now; }; // 기다리는 단계를 뺀 단계별 시간
function setStep(st){
  haltStep(); stopSpeech(); tickStep(); clearTimeout(resAnnounce);
  if(st==='ride'){ clearTimeout(noti._t); $('noti').hidden=true; }
  if(toastIsMistake) hideMessages(); // 고친 뒤에도 "다시 골라 봐요"가 남지 않게 해요
  S.step=st; S.hintOpen=false; S.listening=false; S.sheetDown=false; sheetDrag=null; liveDirty=false;
  markGuide();
  render();
  { const sh=$('sheet'); sh.setAttribute('role','group'); sh.setAttribute('aria-label',STEP_SAY[st]()); sh.classList.remove('enter'); void sh.offsetWidth; sh.classList.add('enter'); clearTimeout(setStep.enterT); setStep.enterT=setTimeout(()=>sh.classList.remove('enter'),700); }
  $('area').scrollTop=0; $('app').scrollTop=0; // 앞 단계에서 내린 스크롤이 다음 단계로 이어지지 않게 해요
  if(PREF.voice) say(WAIT[st]||guided() ? HINT[st]() : STEP_SAY[st]());
  announce(STEP_SAY[st]());
  if(st!=='search') quietFocus($('sheet')); // 누른 버튼이 사라져도 키보드와 낭독기가 새 단계에서 이어 가요
  if(st==='search') later(()=>{const q=$('q');if(q&&!S.listening)quietFocus(q)},60);
  if(st==='calling') later(()=>{ setStep('approach'); const V=myCar(); noti('택시가 배정됐어요 (연습)',`${V.plate} · ${V.color} ${V.model} · ${carOf(S.car).eta}분 뒤 도착해요`); },4000);
  if(st==='approach'){ const eta=carOf(S.car).eta;
    later(()=>runAlong(S.approach,7000,t=>{const e=$('eta');if(e)e.textContent=Math.max(1,Math.ceil(eta*(1-t)))+'분'},
      ()=>{ const V=myCar(); setStep('plate'); noti('택시가 도착했어요 (연습)',`${V.plate} ${V.color} ${V.model}${eul(V.model)} 찾아서 타요`); }),300); }
  if(st==='ride'){ const {min}=fareOf(S.dest);
    later(()=>runAlong(routePath(S.dest),7000,t=>{const b=$('ride-bar'),m=$('ride-min');if(b)b.style.width=(t*100).toFixed(1)+'%';if(m)m.textContent=Math.max(1,Math.ceil(min*(1-t)))+'분'},
      ()=>setStep('arrive')),300); }
}
let lastMist={key:'',at:-1e9};
function mistake(msg,key){ // 같은 곳을 손이 떨려 연달아 누른 건 한 번으로 세요
  const now=performance.now(), dup=key===lastMist.key&&now-lastMist.at<800; lastMist={key,at:now};
  if(!dup){ S.mist++; S.sk[SKILL_OF[S.step]].m++; if(PREF.voice) say(msg); }
  toast(msg,'mist'); toastIsMistake=true;
}
function begin(){ S.t0=flowNow(); S.screen='ride'; MapCtl.lastKey=null; setStep('home'); }

// 막힌 단계: 그만둔 곳, 끝까지 했으면 실수×3 + 힌트×2(테스트) + 90초 초과 1 이 가장 큰 곳
function stuckStep(done){
  if(!done) return SKILL_OF[S.step];
  let best=null, top=0;
  SKILLS.forEach(([k])=>{ const s=S.sk[k], w=s.m*3+(S.mode==='test'?s.h*2:0)+(s.ms>90000?1:0); if(w>top){top=w;best=k} });
  return best;
}
function buildResult(done){
  tickStep();
  const sec=Math.round((flowNow()-S.t0)/1000), test=S.mode==='test', hints=test?S.hints:0;
  const score=Math.max(30,Math.min(100,100-S.mist*15-hints*8-(sec>240?10:0)));
  const solo=done&&test&&hints===0&&S.mist===0;
  const stuck=solo?null:stuckStep(done); // 혼자 성공이면 어려웠던 단계를 남기지 않아요
  // ok: 해냈으면 true, 어려웠거나 그만둔 단계는 false, 아직 끝내지 않은 뒤 단계는 null
  const curIdx=done?SKILLS.length:SKILLS.findIndex(([k])=>k===SKILL_OF[S.step]);
  const steps={};
  SKILLS.forEach(([k],i)=>{
    const s=S.sk[k], clean=s.m===0&&(!test||s.h===0);
    steps[k]={ok:i<curIdx?clean:(i===curIdx?false:null), mic:!!s.mic, moved:!!s.moved, hints:test?s.h:0, mist:s.m, guided:!test&&!!s.g, sec:Math.round(s.ms/1000)};
  });
  return {type:'baepu:practice-result', kind:'taxi', mode:S.mode, mission:S.missionOn?MISSION_KEY:null, dest:S.dest, car:S.car,
    success:done, solo, score:done&&test?score:null, sec, hints, mist:S.mist,
    stuckAt:stuck, recommend:stuck?RECOMMEND[stuck]:null, steps,
    fare:S.dest?carFare(fareOf(S.dest).f,S.car):null, finishedAt:new Date().toISOString()};
}
const hostOrigin=()=>(CONFIG.PARENT_ORIGIN||location.origin).replace(/\/+$/,'');
function parentAccepts(){ // 부모 창이 설정한 주소일 때만 메시지가 실제로 닿아요
  if(window.parent===window) return false;
  const want=hostOrigin(); if(want==='null') return false;
  try{ const a=location.ancestorOrigins; if(a&&a.length) return a[0]===want; }catch(e){}
  try{ return window.parent.location.origin===want; }catch(e){}
  try{ return !!document.referrer&&new URL(document.referrer).origin===want; }catch(e){ return false; }
}
const hasHost=()=>parentAccepts()||typeof window.onBaepuPracticeResult==='function';
function postToHost(msg){ if(!parentAccepts()) return; try{ window.parent.postMessage(msg,hostOrigin()); }catch(e){} }
function toHost(msg){ postToHost(msg); try{ if(typeof window.onBaepuPracticeResult==='function') window.onBaepuPracticeResult(JSON.parse(JSON.stringify(msg))); }catch(e){} }
// 결과 요약을 이 기기에도 남겨요. 링크로 열어 보낼 곳이 없어도 기록이 사라지지 않게 하려는 거예요. 집 위치는 넣지 않아요
const LOG_KEY='baepu.taxi.results';
function readLog(){ try{ const a=JSON.parse(localStorage.getItem(LOG_KEY)); return Array.isArray(a)?a.filter(x=>x&&typeof x==='object'):[]; }catch(e){ return []; } }
function saveLog(r){ try{ const a=readLog(); a.push({at:r.finishedAt,mode:r.mode,named:S.named,success:r.success,solo:r.solo,sec:r.sec,hints:r.hints,mist:r.mist,stuckAt:r.stuckAt}); localStorage.setItem(LOG_KEY,JSON.stringify(a.slice(-30))); }catch(e){} }
const soloCount=()=>readLog().filter(x=>x.solo&&!!x.named===S.named).length; // 기본 연습과 테스트를 따로 세요
function finish(){
  haltStep();
  S.res=buildResult(true); saveLog(S.res);
  toHost(S.res); // 본 서비스로 돌려주기. 화면 문제가 있어도 결과는 먼저 보내요
  S.screen='result'; render();
  announce(document.querySelector('.result-hd').textContent.trim()); quietFocus($('panel'));
  say(S.mode==='test'?(S.res.solo?'혼자 해냈어요':'끝까지 해냈어요. 한 번 더 연습해 봐요'):'연습을 끝까지 했어요');
}
function reportStop(){ const r=buildResult(false); saveLog(r); toHost(r); } // 중간에 그만둬도 막힌 단계를 남겨요
function exitNow(){
  haltStep(); stopSpeech(); hideMessages();
  postToHost({type:'baepu:practice-exit',kind:'taxi'});
  S=fresh(S.mode,S.missionOn,S.named); MapCtl.lastKey=null; render(); // 부모가 iframe을 다시 보여 줘도 멈춘 화면이 남지 않게 처음으로 돌려요
}

/* =====================================================================
   11. 알림·소리
   ===================================================================== */
function placeMsg(el){ const c=$('coach'), b=(c.hidden?document.querySelector('.prac-banner'):c).getBoundingClientRect(), p=$('phone'); el.style.top=Math.max(6,b.bottom-p.getBoundingClientRect().top-p.clientTop+6)+'px'; }
function hideMessages(){ clearTimeout(toast._t); clearTimeout(noti._t); $('toast').hidden=true; $('noti').hidden=true; }
let toastIsMistake=false;
function toast(m,kind){ hideMessages(); toastIsMistake=false; announce(m); const t=$('toast'); t.className=kind||''; t.textContent=m; placeMsg(t); t.hidden=false; toast._t=setTimeout(()=>t.hidden=true, Math.max(5000,m.length*170)); }
function noti(title,body){ hideMessages(); const n=$('noti'); if(S.step!=='approach'&&S.step!=='plate') announce(`${title}. ${body}`); n.innerHTML=`<span class="ni">${I('taxi')}</span><div><b>${title}</b><p>${body}</p></div>`; placeMsg(n); n.hidden=false; noti._t=setTimeout(()=>n.hidden=true,5000); }
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }
function say(t,force){ if((!PREF.voice&&!force)||!t) return; try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}catch(e){} }

/* 안내창: 열려 있는 동안 뒤 화면은 터치도 키보드도 닿지 않아요 */
let modalFrom=null, lastExitAt=-1e9;
function openModal(html,label){ lastStepAt=performance.now(); modalFrom=document.activeElement; $('modal').innerHTML=html; $('modal').setAttribute('aria-label',label); $('modal').setAttribute('aria-describedby','modal-desc'); $('modal').hidden=false; $('app').inert=true; $('modal').querySelector('[data-a=modal-no]').focus(); }
function closeModal(){ $('modal').hidden=true; $('app').inert=false; lastStepAt=performance.now(); const f=modalFrom; modalFrom=null; if(f&&f.isConnected) quietFocus(f); setTimeout(flushLive,0); }
const confirmHTML=(title,body,noText,yesAction,yesText,risky)=>`<div class="modal-in"><h3>${title}</h3><p id="modal-desc">${body}</p><div class="row2">${risky?`<button class="btn ghost risky" data-a="${yesAction}">${yesText}</button><button class="btn dark" data-a="modal-no">${noText}</button>`:`<button class="btn ghost" data-a="modal-no">${noText}</button><button class="btn dark" data-a="${yesAction}">${yesText}</button>`}</div></div>`;

/* =====================================================================
   12. 누르기
   ===================================================================== */
const A = {
  start:()=>{ if(!City3D.leave(begin)) begin(); },
  locate:()=>{ if(S.step==='origin') setPick(HOME); else if(S.pick!==HOME){ S.pick=HOME; S.pickName=''; S.live=null; S.sk.origin.moved=0; MapCtl.lastKey=null; render(); } MapCtl.impl.refit(); toast('현재 위치로 지도를 맞췄어요'); },
  'open-search':()=>setStep('search'),
  'open-mic':()=>{ setStep('search'); A.mic(); },
  'search-back':()=>setStep('home'),
  mic:()=>{ if(S.listening) return;
    S.listening=true; render(); announce('듣고 있어요.');
    later(()=>{ S.sk.search.mic=1; // 말로 찾기도 실제 앱에 있는 방법이에요. 힌트로 세지 않고, 끝까지 들었을 때만 기록해요
      S.listening=false;S.q=S.missionOn?PLACES[MISSION_KEY].n:'광교호수공원';if(S.step==='search'){ render(); announce(`${S.q}${eul(S.q)} 찾았어요.`); } },1800); },
  pick:v=>{ if(S.missionOn&&v!==MISSION_KEY){ mistake(`오늘 갈 곳은 "${PLACES[MISSION_KEY].n}"${eyo(PLACES[MISSION_KEY].n)}. 다시 골라 봐요`,'pick:'+v); return; } S.dest=v; setStep('route'); refreshLive(); },
  'route-back':()=>{S.dest=null;setStep('home')},
  car:v=>{S.car=v;render()},
  'car-ok':()=>{ if(S.missionOn&&S.car!=='일반'){ mistake('오늘은 "일반택시"로 불러 봐요. 일반택시를 먼저 눌러요','car-ok'); return; } setStep('origin'); refreshLive(); },
  'pick-back':()=>setStep('route'),
  'pin-move':v=>{ const d={n:[.00027,0],s:[-.00027,0],w:[0,-.00034],e:[0,.00034]}[v]; if(!d) return; // 한 번에 약 30m
    if(tryPick({lat:S.pick.lat+d[0],lon:S.pick.lon+d[1]})){ MapCtl.impl.refit(); announce(`탑승 위치를 옮겼어요. 현재 위치에서 약 ${Math.round(km(S.pick,HOME)*1000)}미터예요.`); } },
  call:()=>{ // 지도가 멈추기 전에 눌러도 끌어 놓은 자리에서 타게, 호출 직전에 지도 가운데를 다시 읽어요
    if(MapCtl.impl===KakaoMap&&KakaoMap.view&&KakaoMap.view.pick){ const c=KakaoMap.map.getCenter(); if(!tryPick({lat:c.getLat(),lon:c.getLng()})) return; }
    if(km(S.pick,PLACES[S.dest])<0.1){ toast('탑승 위치가 도착지와 너무 가까워요. 조금 떨어진 곳을 골라 봐요'); toastIsMistake=true; return; }
    S.plates=plateOpts(S.car); S.plateBad=-1; S.approach=approachPath(); setStep('calling');
    // 핀을 멀리 옮겼으면 기사님이 오는 길도 그 위치 기준으로 받아요. 호출 중(4초) 안에 오면 써요
    if(!routeData('mpst')&&MapCtl.impl===KakaoMap){ const at=S.pick; fetchRoute(at,'mpst').then(r=>{ if(r&&S.step==='calling'&&S.pick===at) S.approach=[...toPts(r.path).reverse(),at]; }); } },
  cancel:()=>{setStep('route');toast('호출을 취소했어요. 다시 불러볼까요?')},
  'cancel-ask':()=>{ pauseFlow('modal'); stopSpeech();
    openModal(confirmHTML('기사님이 오고 있어요. 취소할까요?','취소하고 다시 부르면 더 먼 택시가 올 수 있어요. 실제 앱에서는 택시 종류에 따라 취소 수수료가 나오기도 하니 안내를 꼭 읽어요. 연습이라 돈은 나가지 않아요.','아니요','cancel-yes','호출 취소하기',true),'호출 취소 확인'); },
  'cancel-yes':()=>{ closeModal(); resumeFlow('modal'); A.cancel(); },
  'pay-open':()=>{ openModal(`<div class="modal-in"><h3>어떻게 낼까요?</h3><p id="modal-desc">카드를 등록해 두면 내릴 때 자동으로 결제돼요. 직접 내는 방법도 있어요.</p><div class="pay-opts">${[['card','연습카드 자동결제','내릴 때 알아서 결제돼요'],['direct','기사님에게 직접','내릴 때 직접 내요']].map(([k,t,d])=>`<button class="pay-opt${S.pay===k?' on':''}" data-a="pay-set" data-v="${k}" aria-pressed="${S.pay===k}"><span><b>${t}</b><small>${d}</small></span>${S.pay===k?I('check'):''}</button>`).join('')}</div><button class="btn ghost" data-a="modal-no">닫기</button></div>`,'결제 수단 고르기'); },
  'pay-set':v=>{ closeModal(); S.pay=v==='direct'?'direct':'card'; render(); },
  fake:v=>toast(v==='share'?'연습 화면이라 보내지 않아요. 실제 앱에서는 내 위치를 가족에게 보낼 수 있어요':v==='safe'?'연습 화면이라 연결되지 않아요. 실제 앱에서는 내 번호를 숨긴 안심번호로 연결돼요':'연습 화면이라 실제로 연결되지 않아요'),
  plate:v=>{ if(S.plates[+v].ok){ toast('맞아요! 번호판을 확인하고 탔어요','good'); setStep('ride'); } else { S.plateBad=+v; mistake('번호판이 달라요. 내 택시 번호를 다시 봐요','plate:'+S.plates[+v].plate); render(); } },
  'arrive-ok':()=>finish(),
  'sheet-toggle':()=>{ if(!sheetJustDragged) setSheet(!S.sheetDown); },
  hint:()=>{ if(S.hintOpen) return; S.hintOpen=true; S.hints++; S.sk[SKILL_OF[S.step]].h++; render(); announce(HINT[S.step]()); const h=document.querySelector('#coach .hint'); if(h&&S.step!=='search'){ h.tabIndex=-1; quietFocus(h); } if(PREF.voice) say(HINT[S.step]()); },
  guide:()=>{PREF.guide=!PREF.guide;markGuide();render()},
  voice:()=>{PREF.voice=!PREF.voice;render();if(PREF.voice)say('소리 안내를 켰어요');else stopSpeech()},
  big:()=>{PREF.big=!PREF.big;render()},
  say:()=>{ say(HINT[S.step](),true); if(!('speechSynthesis' in window)) toast(HINT[S.step]()); },
  again:()=>{ S=fresh(S.mode,S.missionOn,S.named); begin(); },
  'to-test':()=>{ S=fresh('test',S.missionOn,true); begin(); },
  exit:()=>{ if(S.screen!=='ride'){
      if(S.screen==='intro'&&!hasHost()){ toast('여기가 처음 화면이에요. 그만하려면 이 창을 닫아요'); return; }
      if(performance.now()-lastExitAt<800) return; lastExitAt=performance.now(); exitNow(); return; }
    pauseFlow('modal'); stopSpeech();
    openModal(confirmHTML(`${S.named?'테스트를':'연습을'} 그만할까요?`,hasHost()?'여기까지 한 것을 기록해서 다음 수업에 반영해요.':'여기까지 한 것을 이 기기에 기록해 둬요.','계속하기','modal-yes','그만하기',true),'그만할지 확인'); },
  'modal-no':()=>{closeModal();resumeFlow('modal')},
  'modal-yes':()=>{closeModal();resumeFlow('modal');reportStop();exitNow()},
  share:()=>{ // flip.pdf 11쪽: 부모님이 동의한 경우에만 자녀에게 공유해요
    openModal(confirmHTML('자녀분에게 결과를 공유할까요?','걸린 시간, 힌트 사용, 어려웠던 단계를 보여 줘요. 원하지 않으면 공유하지 않아도 돼요.','공유 안 해요','share-yes','공유해요'),'자녀분에게 공유할지 확인'); },
  'share-yes':()=>{ closeModal(); S.shared=true; const r=S.res;
    // 동의 창에 적은 내용만 보내요
    toHost({type:'baepu:practice-share',kind:'taxi',result:{mode:r.mode,success:r.success,solo:r.solo,sec:r.sec,hints:r.hints,stuckAt:r.stuckAt,finishedAt:r.finishedAt}});
    render(); toast('자녀분에게 공유를 요청했어요'); },
  book:()=>{ if(S.booked) return; S.booked=true; toHost({type:'baepu:practice-book',kind:'taxi',topic:S.res.recommend||'실제 택시 앱으로 택시 부르기',stuckAt:S.res.stuckAt}); render(); toast('다음 수업 예약을 요청했어요'); },
  'exit-now':()=>exitNow()
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el&&S.sheetDown&&!sheetJustDragged&&e.target.closest('#sheet')){ setSheet(false); return; } // 접힌 시트는 어디를 눌러도 펴져요
  if(!el||!$('phone').contains(el)||!MapCtl.ready) return; // 지도 준비 중에는 누르지 않아요
  if(!$('modal').hidden&&!$('modal').contains(el)) return; // 안내창 뒤는 누를 수 없어요
  if(!$('panel').hidden&&el.closest('#sheet,#mapui')) return; // 패널 뒤도 마찬가지예요
  if(el.dataset.a!=='exit'&&performance.now()-lastStepAt<350) return;
  const f=A[el.dataset.a]; if(f) f(el.dataset.v);
});
let resAnnounce=0;
document.addEventListener('input',e=>{ if(e.target.id!=='q') return;
  const changed=e.target.value!==S.q; S.q=e.target.value;
  if(S.listening){ S.listening=false; clearTimers(); const l=document.querySelector('.listen'); if(l) l.remove(); const m=document.querySelector('.mic'); if(m) m.classList.remove('live'); } // 직접 쓰면 듣기를 멈춰요
  if(changed){ clearTimeout(resAnnounce); resAnnounce=setTimeout(()=>{ const n=document.querySelectorAll('.res-i').length; announce(document.querySelector('#res .empty')?'검색 결과가 없어요. 가까운 곳을 대신 보여 드려요.':n?`${n}곳을 찾았어요.`:'검색 결과가 없어요.'); },500); }
  if(changed) $('res').innerHTML=resultsHTML(); // 값이 같으면 목록을 바꾸지 않아요(누르는 중인 버튼이 사라지지 않게)
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('modal').hidden) A['modal-no'](); });
document.addEventListener('visibilitychange',()=>{ document.hidden?pauseFlow('hidden'):resumeFlow('hidden'); }); // 전화를 받는 시간 등은 걸린 시간에서 빼요
if(document.hidden) pauseFlow('hidden');

/* =====================================================================
   13. 시작
   ===================================================================== */
setInterval(()=>{ const t=$('timer'); if(t&&S.screen==='ride') t.textContent=mmss(); },1000); // 테스트 경과 시간
(function clock(){const d=new Date();$('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(clock,30000)})();
$('panel').hidden=false; $('panel').innerHTML='<div class="empty" role="status" style="margin:auto">지도를 준비하고 있어요.<br>잠깐만 기다려요.</div>';
MapCtl.init($('map')).catch(e=>{ console.warn('[배프] 지도 준비 오류:',e.message); MapCtl.ready=true; }).then(()=>{ if(PARAMS.start) begin(); else render(); });
</script>
