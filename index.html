<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>배프 · 택시 부르기 연습</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
==========================================================================
 배프 · 택시 부르기 연습 (단독 페이지)
--------------------------------------------------------------------------
 ■ 팀원이 바꿀 곳: 아래 <script> 맨 위의 CONFIG (Netlify 외의 주소를 쓰면 ON_NETLIFY도)
     KAKAO_JS_KEY 를 넣으면 카카오맵, 비워두면 그림 지도(SVG)로 동작해요.
     카카오맵을 쓰려면 카카오 개발자 콘솔에서
       ① 앱의 카카오맵 API 활성화
       ② JavaScript 키의 'JavaScript SDK 도메인'에 이 페이지 주소 등록
          (예: http://127.0.0.1:5500 — 포트까지 정확히)
     파일을 더블클릭(file://)으로 열면 카카오맵은 뜨지 않고 그림 지도로 바뀌어요.

 ■ 받는 값 (URL 쿼리, 전부 생략 가능)
     mode=practice|test   practice: 힌트를 따라 하는 연습, test: "테스트"로 표시. 없으면 힌트를 골라 보는 기본 연습
     dest=ajou|...        미션 목적지 key(PLACES 참고). 없으면 자유 연습
     home=37.256,127.0665 배움님 집(출발지) 위도,경도. 기본 집에서 20km 밖이면 기본 집으로
     area=영통동 청명마을   출발지 이름
     guide=0              연습 모드에서 도움말 끄고 시작
     voice=1              소리 안내 켜고 시작
     big=1                큰 글씨로 시작
     tutor=김민지          담당 프렌드 이름(결과 문구). 없으면 "담당 프렌드"
     start=1              시작 화면 건너뛰고 바로 시작

 ■ 돌려주는 값 (iframe 부모에게 postMessage. 받는 곳은 CONFIG.PARENT_ORIGIN으로 제한)
     {type:'baepu:practice-result', ...}  끝까지 했을 때와, 중간에 그만뒀을 때(success:false, stuckAt)
     {type:'baepu:practice-share', ...}   배움님이 "자녀에게 공유"에 동의했을 때만
     {type:'baepu:practice-book', ...}    "다음 수업 예약"을 눌렀을 때
     {type:'baepu:practice-exit'}         나가기
     window.onBaepuPracticeResult = fn 을 정의해 두면 result, share, book을 그 함수로도 받아요.
     결과 형식은 buildResult() 함수 참고. 결과 요약은 이 기기에도 저장돼요(집 위치는 넣지 않아요).
==========================================================================
-->
<style>
/* 시안 방향: 밤 도로를 달리는 택시. 깊은 남색과 절제한 금색, 넓은 여백과 얇은 경계선으로 어른스럽게 */
:root{
  --sky:#E8EEF8; --sky-2:#F1F4F9; --blue:#1F66E5; --blue-ink:#1A4FB0;
  --butter:#F3E2B3; --butter-2:#F8F3E6; --gold:#D9A520;
  --ink:#111827; --ink-2:#566072; --ink-3:#8791A1; --line:#E5E8EE; --paper:#FFFFFF; --bg:#F5F6F8; --night:#0D1320;
  --mint:#14865F; --mint-2:#DDF3EA; --coral:#DE3B3B; --coral-2:#FBE4E4;
  --stage:#E4E6EA; --taxi:#EFC24A; --map:#E9EBE6;
  --f-display:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink)}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:1.35em;height:1.35em;flex:none}

/* ---------- 폰 프레임 ---------- */
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding:24px 16px;
  background-image:radial-gradient(circle at 1px 1px,#cfe0ee 1px,transparent 1.5px);background-size:22px 22px}
.phone{container-type:size;width:392px;height:min(820px,calc(100vh - 48px));height:min(820px,calc(100dvh - 48px));border:10px solid #1E2833;border-radius:46px;background:var(--bg);
  overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(31,61,96,.35)}
.sb{flex:none;display:flex;justify-content:space-between;align-items:center;padding:.55em 1.6em .3em;font-size:13px;font-weight:700;background:var(--paper)}
.sb i{display:inline-block;width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;vertical-align:-1px}
.sb i::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:var(--ink);border-radius:1px}
#app{flex:1;min-height:0;display:flex;flex-direction:column;font-size:17px;line-height:1.5;position:relative;word-break:keep-all;overflow-wrap:anywhere}
.big #app{font-size:20px}
@media (max-width:760px){
  .stage{height:100%;display:block;padding:0;background:var(--bg)}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .sb{display:none}
  /* Netlify 무료 요금제의 안내 배지가 화면 아래를 덮어요. 배지는 그대로 두고 버튼이 가려지지 않게 그만큼 비워요 */
  .on-netlify .phone{height:calc(100% - 64px)}
  .on-netlify .foot,.on-netlify .pfoot{padding-bottom:.7em}
}

/* ---------- 연습 배너 + 코치 ---------- */
.prac-banner{flex:none;display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.45em .9em;font-weight:800;font-size:.8em;
  background:repeating-linear-gradient(-45deg,var(--butter) 0 12px,#FFD54A 12px 24px)}
.prac-banner .logo{flex:none;display:flex;align-items:center;gap:.25em;background:rgba(255,255,255,.75);border-radius:10px;padding:.1em .45em}
.prac-banner .logo b{font-family:var(--f-display);font-weight:400;font-size:1.15em;line-height:1}
.prac-banner>span:not(.logo){flex:1;min-width:0}
.prac-banner button{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:.3em .8em;font-weight:800;font-size:.95em;min-height:44px;min-width:44px;flex:none}
.coach{flex:none;display:flex;flex-direction:column;gap:.4em;padding:.6em .9em;background:var(--paper);border-bottom:1px solid var(--line)}
.c-row{display:flex;align-items:flex-start;gap:.5em;font-weight:800;font-size:.9em;line-height:1.4}
.tag{background:var(--blue);color:#fff;border-radius:8px;padding:.1em .5em;font-size:.82em;flex:none;margin-top:.1em}
.tag.test{background:var(--ink)}
.c-row .tag{white-space:nowrap}
.m-short{display:none}
.c-prog{display:flex;align-items:center;gap:.3em;font-size:.78em;font-weight:700;color:var(--ink-2)}
.c-prog i{width:1.6em;height:5px;border-radius:9px;background:var(--line)}
.c-prog i.done{background:var(--mint)}
.c-prog i.on{background:var(--blue)}
.c-bars{display:inline-flex;align-items:center;gap:.3em}
.c-step{margin-left:.4em}
.c-time{margin-left:auto;font-size:1.1em;font-weight:800;color:var(--ink);line-height:1.3}
.hint{display:flex;align-items:flex-start;gap:.5em;font-size:.9em;color:var(--blue-ink);background:var(--sky-2);border-radius:12px;padding:.5em .65em}
.hint svg{flex:none;margin-top:.1em}
.hint span{flex:1}
.hint button{border:0;background:none;padding:0;color:var(--blue-ink);min-width:44px;min-height:44px;margin:-.45em -.4em -.45em 0;display:grid;place-items:center;flex:none}
.coach-tools{display:flex;gap:.4em;justify-content:flex-end;flex-wrap:wrap}
.coach-tools button{border:1px solid #A9B6C2;background:var(--paper);border-radius:99px;font-size:.8em;font-weight:700;padding:.2em .8em;color:var(--ink-2);min-height:44px}
.coach-tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.coach-tools button:disabled{cursor:default}
.coach-tools button.help-btn{margin-right:auto;border:2px solid var(--ink);background:var(--butter);color:var(--ink);font-weight:800}
.coach-tools button.help-btn:disabled{opacity:1;background:var(--paper)}
.tgt{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--gold);animation:tgt 1.2s infinite;position:relative;z-index:2}
@keyframes tgt{50%{box-shadow:0 0 0 3px var(--ink),0 0 0 11px rgba(227,174,0,.45)}}
.res-i.tgt{animation:none;box-shadow:inset 0 0 0 3px var(--ink);background:var(--butter-2)}

/* ---------- 지도 + 바텀시트 ---------- */
.area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--map);overflow-y:auto;overflow-x:hidden}
.area.lock{overflow:hidden}
.map-wrap{--map-min:clamp(110px,26vh,210px);flex:1 0 var(--map-min);min-height:var(--map-min);position:relative;overflow:hidden}
.big .map-wrap{--map-min:clamp(84px,16vh,180px)}
.foot{flex:none;background:var(--paper);border-top:1px solid var(--line);padding:.6em 1em calc(.7em + env(safe-area-inset-bottom,0px));position:relative;z-index:5}
#map{position:absolute;inset:0}
#map.on-kakao{bottom:18px} /* 시트가 18px 겹쳐요. 카카오 로고·저작권 표시가 가려지지 않게 지도를 그만큼 올려요 */
#map.locked{pointer-events:none} /* 고정 단계: 끌기·더블클릭 확대를 막고 터치는 화면 스크롤로 넘겨요 */
#map.locked a{pointer-events:auto}
#map.short .k-pin b{visibility:hidden} /* 상자 크기를 유지해야 핀 끝이 좌표에서 어긋나지 않아요 */
#map>svg{position:absolute;inset:0;width:100%;height:100%;display:block} /* 그림 지도만. 카카오맵 위 택시 아이콘에는 적용되면 안 돼요 */
.map-ui{position:absolute;inset:0;pointer-events:none;z-index:3}
.map-ui>*{pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sheet:focus,.panel:focus,.hint:focus{outline:none}
/* 키보드로 들어오면 나타나는 핀 옮기기 버튼. 손가락으로는 지도를 끌면 돼요 */
.pin-move{position:absolute;right:.9em;top:.5em;display:flex;gap:4px;opacity:0;pointer-events:none}
.pin-move:focus-within{opacity:1;pointer-events:auto}
.pin-move button{width:44px;height:44px;border:0;border-radius:50%;background:var(--paper);box-shadow:0 3px 10px rgba(30,40,51,.22);font-size:1.1em;font-weight:800;color:var(--ink)}
.fab{position:absolute;width:2.7em;height:2.7em;border-radius:50%;border:0;background:var(--paper);box-shadow:0 3px 10px rgba(30,40,51,.22);display:grid;place-items:center;color:var(--ink)}
.cancel-chip{position:absolute;top:.7em;right:.7em;border:0;background:var(--paper);border-radius:99px;box-shadow:0 3px 10px rgba(30,40,51,.22);padding:0 1em;min-height:44px;font-weight:800;font-size:.9em;color:var(--ink)}
.route-bar{position:absolute;top:.6em;left:.7em;right:.7em;display:flex;align-items:center;gap:.35em;background:var(--paper);border-radius:99px;box-shadow:0 3px 10px rgba(30,40,51,.22);padding:0 1em 0 .1em;min-height:48px;font-weight:800;font-size:.92em}
.route-bar button{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);flex:none}
.route-bar span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-bar .from{flex:0 1 auto;color:var(--ink-2)}
.route-bar em{font-style:normal}
.route-bar small{font-size:.76em;font-weight:800;color:var(--ink-2);margin-right:.1em}
.route-bar i{flex:none;font-style:normal;color:var(--ink-2)}
.route-bar .to{flex:1 1 0}
.fab.loc{right:.7em;bottom:1.9em;color:var(--blue)}
.map-badge{position:absolute;left:.7em;bottom:1.9em;background:rgba(255,255,255,.88);border-radius:99px;padding:.15em .65em;font-size:.68em;font-weight:700;color:var(--ink-2);pointer-events:none}
.sheet{flex:none;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(30,40,51,.12);padding:.6em 1em 1.1em;display:flex;flex-direction:column;gap:.7em;position:relative;z-index:4;margin-top:-18px;transition:max-height .22s ease}
/* 손잡이: 끌어서 시트를 내리고 올려요. 눌러도 접히고 펴져요 */
.grab{display:grid;place-items:center;flex:none;width:calc(100% + 2em);height:44px;margin:-.6em -1em -.75em;padding:0;border:0;background:none;touch-action:none;cursor:grab}
.grab::before{content:"";width:3em;height:6px;border-radius:9px;background:#6B7A89}
.sheet.down .grab::before{content:"▲ 더 보기";width:auto;height:auto;background:none;font-size:.85em;font-weight:800;color:var(--ink-2)}
.grab:hover::before{background:var(--ink-2)}
.sheet.dragging{transition:none;overflow:hidden}
.sheet.dragging .grab{cursor:grabbing}
.sheet.down{overflow:hidden;cursor:pointer}
.sheet h3{margin:0;font-size:1.25em;font-weight:800;line-height:1.35}
.muted{color:var(--ink-2)}
.small{font-size:.85em}
.sheet p{margin:0}
.tabnum{font-variant-numeric:tabular-nums}
.note{background:var(--butter-2);border-radius:14px;padding:.65em .85em;font-size:.88em}
.note.blue{background:var(--sky-2)}

.tx-call{border:0;border-radius:14px;background:var(--taxi);color:var(--ink);font-weight:800;font-size:1.15em;min-height:3.2em;width:100%}
.tx-call:hover{background:#FFC800}
.btn{display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;min-height:3em;padding:.4em 1em;border-radius:14px;border:0;font-weight:800;font-size:1em}
.btn.ghost{background:var(--paper);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.y{background:var(--taxi)}
.btn:disabled{opacity:.75;cursor:default}
.link{border:0;background:none;color:var(--ink-2);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:.3em .6em;font-size:.88em;align-self:center;min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.row3 button{display:flex;flex-direction:column;align-items:center;gap:.2em;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:.55em .2em;font-weight:700;font-size:.82em}

/* 출발/도착 */
.ft{display:flex;flex-direction:column;gap:.45em;background:#F6F7F8;border-radius:14px;padding:.7em .85em}
.ft-r{display:flex;align-items:center;gap:.6em}
.ft-r small{display:block;font-size:.72em;color:var(--ink-2);font-weight:700;line-height:1.2}
.ft-r b{font-size:.95em}
.dot{width:.75em;height:.75em;border-radius:50%;flex:none}
.dot.s{background:var(--blue);box-shadow:0 0 0 3px #CFE3F5}
.dot.e{background:var(--coral);box-shadow:0 0 0 3px #F6D3CB}

/* 검색 */
.tx-search-wrap{position:relative}
.tx-search{display:flex;align-items:center;gap:.6em;border:0;background:#F1F3F5;border-radius:14px;padding:.8em 3.5em .8em .9em;font-size:1.05em;font-weight:700;color:#55606B;text-align:left;width:100%;min-height:3.4em}
.tx-search span{flex:1}
.mic-ic{position:absolute;right:.45em;top:50%;transform:translateY(-50%);z-index:3;width:2.75em;height:2.75em;border:0;border-radius:50%;background:var(--taxi);display:grid;place-items:center;color:var(--ink)}
.res-h{font-size:.8em;font-weight:800;color:var(--ink-2);padding:.2em 0 0}
.quick{display:flex;gap:.45em;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:.3em;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.4em .75em;font-weight:700;font-size:.85em;min-height:44px}
.quick svg{width:1.1em;height:1.1em;color:var(--ink-2)}

/* 전체 화면 패널 (검색·시작·결과) */
.panel{position:absolute;inset:0;z-index:6;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.tx-sh{flex:none;display:flex;align-items:center;gap:.4em;padding:.6em .7em;border-bottom:1px solid var(--line)}
.tx-sh input{flex:1;min-width:0;font:inherit;font-size:1.05em;font-weight:600;border:0;background:#F1F3F5;border-radius:12px;padding:.7em .8em;color:var(--ink)}
.tx-sh input::placeholder{color:#55606B;opacity:1}
.ic-btn{width:2.4em;height:2.4em;min-width:44px;min-height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;flex:none}
.ic-btn:hover{background:var(--sky-2)}
.mic{width:2.8em;height:2.8em;border-radius:50%;border:0;background:var(--taxi);display:grid;place-items:center;flex:none}
.mic.live{background:var(--coral);color:#fff}
.listen{flex:none;display:flex;flex-direction:column;align-items:center;gap:.4em;padding:1.1em;border-bottom:1px solid var(--line);text-align:center}
.listen small{color:var(--ink-2);font-size:.8em}
.wave{display:flex;gap:4px;height:2.2em;align-items:center}
.wave i{width:6px;border-radius:4px;background:var(--coral);animation:wv .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:.5em}50%{height:2.2em}}
.res{flex:1;overflow-y:auto}
.res .res-h{padding:.8em 1em .3em}
.res-i{display:flex;align-items:center;gap:.7em;width:100%;border:0;background:none;border-bottom:1px solid var(--line);padding:.85em 1em;text-align:left}
.res-i:hover{background:var(--bg)}
.res-i>svg{color:var(--ink-2)}
.res-i span{flex:1;min-width:0}
.res-i b{display:block;font-size:1.02em}
.res-i small{color:var(--ink-2);font-size:.82em}
.res-i em{font-style:normal;font-size:.82em;color:var(--ink-2);font-weight:700}
.empty{text-align:center;color:var(--ink-2);padding:2em 1em;line-height:1.6}

/* 차종 */
.cars{display:flex;flex-direction:column;gap:.35em}
.car{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:.6em;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:.25em .7em;text-align:left;min-height:2.8em}
.car .cimg{width:2.6em;height:1.9em;display:grid;place-items:center;background:#F4F6F8;border-radius:10px}
.car .cimg svg{width:2.5em;height:1.67em}
.car .cname{grid-column:2;min-width:0}
.car .cname b{display:block;font-size:1em;line-height:1.25}
.car .cname small{display:block;color:var(--ink-2);font-size:.82em;line-height:1.25}
.car .cfare{grid-column:3;white-space:nowrap;font-weight:800;font-size:1.05em;line-height:1.2;text-align:right}
.car .cfare small{display:block;font-weight:700;font-size:.72em;color:var(--ink-2)}
.car.on{border-color:var(--ink);background:#FFFBE6}
[data-step=route] .sheet{gap:.45em}
.trip{font-weight:800;font-size:.95em;color:var(--ink-2)}
.trip b{color:var(--ink);font-size:1.08em}
.pick-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6em}
.pick-h span{font-size:.88em;font-weight:800;color:var(--ink-2)}
.pick-h span b{color:var(--ink)}
.payrow{border:0;background:none;padding:0;width:100%;min-height:44px;text-align:left;display:flex;align-items:center;gap:.5em;font-size:.85em;color:var(--ink-2);font-weight:600}
.payrow span{margin-left:auto;font-size:.9em;color:#17704F;font-weight:800}

/* 호출 중 / 배차 */
.radar{width:4.8em;height:4.8em;border-radius:50%;background:var(--taxi);margin:.3em auto;position:relative;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--taxi);animation:ring 1.6s infinite}
.radar::after{animation-delay:.8s}
.radar svg{width:2.2em;height:2.2em}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.eta{font-family:var(--f-display);font-size:1.6em;line-height:1.2}
.eta em{font-style:normal;color:var(--coral)}
.drv{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .7em;border:1px solid var(--line);border-radius:16px;padding:.7em .8em}
.drv .av{width:2.6em;height:2.6em;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:800;flex:none}
.drv>div{flex:1 1 7.5em;min-width:0}
.drv b{display:block}
.drv small{color:var(--ink-2);font-size:.8em}
.plate{display:inline-block;border:2.5px solid var(--ink);border-radius:8px;padding:.1em .55em;font-size:1.25em;font-weight:800;letter-spacing:.04em;background:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.plate.sm{font-size:1em;padding:0 .4em;border-width:2px}
.plates{display:flex;flex-direction:column;gap:.45em}
.pc{display:flex;align-items:center;gap:.55em;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:.4em .6em;width:100%;min-height:3.1em;text-align:left}
.pc svg{width:2.7em;height:1.8em;flex:none}
.pc .plate{font-size:1em;padding:0 .35em;border-width:2px;flex:none} /* 위에 나온 내 번호판과 같은 크기로 비교해요 */
.pc small{font-size:.85em;color:var(--ink-2);margin-left:auto;text-align:right;line-height:1.25}
.ridebar{height:.7em;border-radius:9px;background:var(--line);overflow:hidden}
.ridebar i{display:block;height:100%;width:0;background:var(--taxi);border-radius:9px}
.receipt{display:flex;flex-direction:column;gap:.5em;background:#F6F7F8;border-radius:14px;padding:.85em}
.receipt div{display:flex;justify-content:space-between;gap:1em}
.receipt .tot{border-top:1px dashed #C9D1D8;padding-top:.5em;font-weight:800;font-size:1.12em}
.paid{display:inline-flex;align-items:center;gap:.25em;color:#17704F;font-weight:800;font-size:.85em}

/* 시작 / 결과 */
.pbody{flex:1;overflow-y:auto;padding:1.1em 1.1em 1.4em;display:flex;flex-direction:column;gap:1em}
.pbody>*{flex:none}
.pfoot{flex:none;padding:.75em 1em calc(1em + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.5em;background:var(--paper)}
.result-hd{display:flex;flex-direction:column;align-items:center;gap:.3em;text-align:center}
.result-hd h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5em;line-height:1.3}
.okmark{width:4.5em;height:4.5em;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center}
.okmark svg{width:2.4em;height:2.4em}
.okmark.retry{background:var(--butter);color:var(--ink)}
.report{display:flex;flex-direction:column;gap:.3em}
.report p{margin:0;color:var(--ink-2);font-size:.93em}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.r-badge{border-radius:99px;padding:.1em .7em;font-size:.85em;font-weight:800;flex:none}
.r-badge.solo{background:var(--mint-2);color:#17704F}
.r-badge.retry{background:var(--butter-2);color:#7A5B00}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:.9em 1em}
.checks{display:flex;flex-direction:column;gap:.55em}
.checks>div{display:flex;align-items:center;gap:.6em;font-size:.93em}
.checks span.t{flex:1;font-weight:700}
.checks small{display:block;font-weight:600;color:var(--ink-2);font-size:.82em}
.ck{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;flex:none}
.ck svg{width:1em;height:1em}
.ck.y{background:var(--mint);color:#fff}
.ck.h{background:var(--butter);color:var(--ink)}

/* 알림·토스트·모달 */
/* 알림과 토스트는 배너 바로 아래에 띄워요(위치는 placeMsg). 배너와 조작 영역을 가리지 않고, 터치도 막지 않아요 */
#noti{position:absolute;left:.6em;right:.6em;z-index:20;background:rgba(255,255,255,.98);border-radius:18px;box-shadow:0 10px 30px rgba(20,40,70,.25);padding:.65em .9em;display:flex;gap:.65em;align-items:flex-start;font-size:17px;animation:drop .3s ease-out;pointer-events:none}
.big #noti,.big #toast,.big .modal-in{font-size:20px}
#noti .ni{width:2.3em;height:2.3em;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--taxi)}
#noti b{display:block;font-size:.85em;color:var(--ink-2)}
#noti p{margin:0;font-weight:700;line-height:1.4}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
#toast{position:absolute;left:.6em;right:.6em;z-index:21;background:var(--ink);color:#fff;padding:.7em 1em;border-radius:14px;font-weight:700;font-size:17px;text-align:center;line-height:1.4;pointer-events:none;box-shadow:0 10px 30px rgba(20,40,70,.3)}
#modal{position:absolute;inset:0;z-index:30;background:rgba(20,28,45,.45);display:flex;align-items:flex-end}
.modal-in{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:1.2em 1.1em 1.3em;display:flex;flex-direction:column;gap:.8em;font-size:17px}
.modal-in{max-height:100%;overflow-y:auto}
.modal-in h3{margin:0;font-size:1.2em}
.modal-in p{margin:0;color:var(--ink-2)}

/* ---------- 카카오맵 위에 올리는 표시 ---------- */
.k-dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(44,119,186,.22),0 2px 6px rgba(0,0,0,.25)}
.k-tag{background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font:800 12px var(--f-body);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.big .k-pin b,.big .k-tag{font-size:15px}
.k-pin{display:flex;flex-direction:column;align-items:center;font-family:var(--f-body)}
.k-pin b{background:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.2);margin-bottom:3px;white-space:nowrap}
.k-pin span{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);margin-bottom:6px}
.k-pin.o span{background:var(--blue)}.k-pin.o b{color:var(--blue-ink)}
.k-pin.d span{background:var(--coral)}.k-pin.d b{color:var(--coral)}
/* 탑승 위치 핀: 지도 가운데에 고정되고 지도가 움직여요. 핀 끝이 지도 중심이에요 */
.map-ui>.center-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;transition:transform .12s}
.map-ui>.center-pin.lift{transform:translate(-50%,calc(-100% - 8px))}
#map.on-kakao~.map-ui>.center-pin{top:calc(50% - 9px)}
#map.short~.map-ui>.center-pin b{visibility:hidden}
#map.low~.map-ui>.center-pin b,#map.low .k-pin.d b{visibility:hidden}
#map.nobar~.map-ui>.route-bar{right:auto;padding:0;width:48px;justify-content:center}
#map.nobar~.map-ui>.route-bar>span,#map.nobar~.map-ui>.route-bar>i{display:none}
#map.pickable{cursor:grab}
#map.pickable>svg{touch-action:none}
.k-taxi svg{width:24px;height:31px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.k-taxi.big svg{width:31px;height:40px}
.k-taxi.big{will-change:transform}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(6px,-3px)}}
.k-radar{width:160px;height:160px;position:relative}
.k-radar i{position:absolute;inset:0;border-radius:50%;background:rgba(255,210,31,.35);border:2px solid var(--gold);animation:kr 2s infinite ease-out}
.k-radar i+i{animation-delay:1s}
@keyframes kr{from{transform:scale(.15);opacity:1}to{transform:scale(1);opacity:0}}


/* ========== 새 디자인 층 (높이별 규칙보다 앞에 둬서 작은 화면 규칙이 그대로 이겨요) ========== */
body{letter-spacing:-.012em}
.stage{background-image:none}
@media (min-width:761px){ .phone{border:9px solid #101318;border-radius:44px;box-shadow:0 40px 70px -30px rgba(16,19,24,.5)} }
.sb{background:#14181F;color:#fff}
.sb i{border-color:#fff}.sb i::after{background:#fff}

/* 연습 배너: 언제나 보이는 얇은 어두운 띠 */
.prac-banner{background:#14181F;color:#fff;font-weight:600;font-size:.76em;padding:.3em .55em .3em 1em}
.prac-banner .logo{display:none}
.prac-banner>span:not(.logo)::before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.5em;border-radius:50%;background:var(--taxi);vertical-align:.08em}
.prac-banner button{background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:.2em .9em}

/* 위쪽 안내 */
.coach{gap:.5em;padding:.75em 1em .7em;border-bottom:0;box-shadow:0 1px 0 var(--line)}
.c-row{align-items:center;font-size:1em;font-weight:800;letter-spacing:-.02em}
.tag{background:var(--taxi);color:var(--ink);border-radius:7px;padding:.12em .5em;font-size:.72em;font-weight:800;margin-top:0}
.tag.test{background:var(--ink);color:#fff}
.c-prog{gap:.6em;font-size:.76em;font-weight:600}
.c-bars{flex:1;gap:3px;max-width:6.5em}
.c-prog i{flex:1;width:auto;height:4px;background:#E2E5E9}
.c-prog i.done,.c-prog i.on{background:var(--ink)}
.c-step{margin-left:0}
.hint{align-items:center;background:#FFF8DB;color:var(--ink);border-radius:14px;padding:.55em .75em;font-weight:500}
.hint button{color:var(--ink)}
.coach-tools{gap:.35em}
.coach-tools button{display:inline-flex;align-items:center;gap:.3em;border:0;background:var(--bg);color:var(--ink);font-weight:600;font-size:.78em;padding:.2em .85em}
.coach-tools button svg{width:1.15em;height:1.15em}
.coach-tools button.on{background:var(--ink);color:#fff}
.coach-tools button.help-btn{border:0;background:var(--bg);font-weight:700}
.coach-tools button.help-btn:disabled{background:var(--taxi);color:var(--ink)}
.tgt{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--gold)}
@keyframes tgt{50%{box-shadow:0 0 0 3px var(--paper),0 0 0 10px rgba(240,180,0,.45)}}
.res-i.tgt{box-shadow:inset 0 0 0 2px var(--ink);background:#FFF8DB}

/* 지도 위 버튼 */
.fab{width:3em;height:3em;box-shadow:0 2px 10px rgba(16,19,24,.18)}
.fab.loc{color:var(--ink)}
.cancel-chip,.route-bar{box-shadow:0 2px 12px rgba(16,19,24,.16)}
.route-bar{border-radius:16px;font-weight:700;letter-spacing:-.02em}
.route-bar small{font-weight:600;color:var(--ink-3)}
.route-bar .from{color:var(--ink-2);font-weight:600}
.map-badge{background:rgba(255,255,255,.92)}

/* 시트 */
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -6px 28px rgba(16,19,24,.1);padding:.6em 1.15em 1.1em;gap:.8em}
.grab{width:calc(100% + 2.3em);margin:-.6em -1.15em -.75em}
.grab::before{width:2.4em;height:4px;background:#C8CDD3}
.grab:hover::before{background:var(--ink-3)}
.sheet h3{font-size:1.32em;letter-spacing:-.03em}
.note{background:var(--bg);border-radius:14px;font-weight:500}
.note.blue{background:var(--bg)}

/* 주 버튼: 진한 검정으로 어디서나 눈에 띄게 */
.foot{border-top:0;box-shadow:0 -1px 0 var(--line);padding:.7em 1.15em calc(.8em + env(safe-area-inset-bottom,0px))}
.tx-call{background:var(--ink);color:#fff;border-radius:16px;font-size:1.12em;font-weight:700;letter-spacing:-.02em;min-height:3.3em}
.tx-call:hover{background:#262C36}
.btn{border-radius:16px;font-weight:700}
.btn.ghost{background:var(--bg);border:0}
.btn.y{background:var(--ink);color:#fff}
.row3 button{border:0;background:var(--bg);border-radius:16px;font-weight:600}
.link{color:var(--ink-2);font-weight:600}

/* 출발·도착 */
.ft{background:var(--bg);border-radius:16px;padding:.75em .9em}
.ft-r small{font-weight:600}
.ft-r b{font-size:1em;font-weight:700}
.dot.s{background:var(--blue);box-shadow:0 0 0 3px #D5E3FB}
.dot.e{background:var(--coral);box-shadow:0 0 0 3px #F9D7D7}

/* 검색 */
.tx-search{background:var(--bg);border-radius:16px;font-weight:700;font-size:1.12em;color:var(--ink);letter-spacing:-.02em;min-height:3.5em}
.mic-ic,.mic{background:var(--taxi)}
.res-h{font-weight:700;color:var(--ink-3)}
.quick button{border:0;background:var(--bg);font-weight:600}
.tx-sh{border-bottom:0;box-shadow:0 1px 0 var(--line)}
.tx-sh input{background:var(--bg);border-radius:14px}
.ic-btn:hover{background:var(--bg)}
.res-i{border-bottom-color:var(--bg)}
.res-i>svg{color:var(--ink-3)}
.res-i b{font-weight:700}

/* 택시 고르기: 테두리를 줄이고, 고른 줄만 또렷하게 */
.cars{gap:.2em}
.car{border-color:transparent;border-radius:16px;padding:.35em .7em;column-gap:.75em}
.car .cimg{width:3.3em;height:2.2em;background:none}
.car .cimg svg{width:3.3em;height:2.2em}
.car .cname b{font-weight:700;letter-spacing:-.02em}
.car .cfare{font-size:1.1em;font-weight:800;letter-spacing:-.02em}
.car.on{border-color:var(--ink);background:#FFF8DB}
.trip{font-weight:600;font-size:.92em}
.trip b{font-weight:800}
.pick-h span{font-weight:600}
.payrow{font-weight:600;color:var(--ink)}
.payrow span{color:var(--ink-2);font-weight:600}

/* 호출 뒤 */
.radar{width:4.4em;height:4.4em}
.eta{font-size:1.75em;font-weight:800;letter-spacing:-.035em}
.eta em{color:var(--ink);background:linear-gradient(transparent 62%,var(--taxi) 62%)}
.drv{border:0;background:var(--bg);border-radius:18px}
.drv .av{background:var(--ink);color:#fff}
.plate{border:2px solid var(--ink);border-radius:7px;background:#fff;font-weight:700;letter-spacing:.03em;box-shadow:inset 0 0 0 1px #fff,0 1px 2px rgba(16,19,24,.18)}
.pc{border-color:transparent;background:var(--bg);border-radius:16px}
.pc small{font-weight:500}
.ridebar{height:.5em;background:#E2E5E9}
.ridebar i{background:var(--ink)}
.receipt{background:var(--bg);border-radius:16px}
.receipt .tot{border-top:1px solid #DADDE2}
.paid{color:var(--mint);font-weight:700}

/* 시작 화면: 택시 표시등 노랑 한 면 */
.panel{background:var(--paper)}
.pbody{padding:0 0 1.2em;gap:1.1em}
.pbody>*{margin-left:1.15em;margin-right:1.15em}
.pfoot{border-top:0;box-shadow:0 -1px 0 var(--line);padding:.7em 1.15em calc(.85em + env(safe-area-inset-bottom,0px))}

/* 결과 */
.pbody:has(.result-hd){padding-top:1.4em}
.result-hd{align-items:flex-start;text-align:left;gap:.55em}
.result-hd h2{font-weight:800;font-size:1.65em;letter-spacing:-.04em;line-height:1.25;text-wrap:balance}
.okmark{width:3em;height:3em;background:var(--ink)}
.okmark svg{width:1.6em;height:1.6em}
.okmark.retry{background:var(--taxi)}
.card{border:0;background:var(--bg);border-radius:18px}
.r-badge.solo{background:var(--ink);color:#fff}
.r-badge.retry{background:var(--taxi);color:var(--ink)}
.ck.y{background:var(--ink)}
.ck.h{background:var(--taxi)}

/* 알림 */
#noti{border-radius:18px;box-shadow:0 12px 34px rgba(16,19,24,.2)}
#toast{background:var(--ink);border-radius:16px}
#modal{background:rgba(16,19,24,.5)}
.modal-in{border-radius:26px 26px 0 0;padding:1.3em 1.15em 1.3em}
.modal-in h3{font-weight:800;letter-spacing:-.03em}

/* 지도 표시 */
.k-dot{background:var(--blue)}
.k-tag{background:var(--ink);border-radius:7px;font-weight:700}
.k-pin b{border-radius:9px;font-weight:700}
.k-pin.o span{background:var(--blue)}.k-pin.o b{color:var(--ink)}
.k-pin.d span{background:var(--coral)}.k-pin.d b{color:var(--ink)}


/* ---------- 시작 화면 ---------- */
.intro{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;background:var(--night);color:#fff;overflow:hidden}
.intro-map{position:absolute;inset:0;width:100%;height:100%}
.intro::after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(to bottom,rgba(13,19,32,0),rgba(13,19,32,.86) 34%,var(--night) 52%)}
.intro-drift{transform-box:fill-box;transform-origin:center;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.1) translateY(4px)}}
.intro-roads path{fill:none;stroke:#2B3650;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.intro-dots circle{fill:#46536E}
.intro-glow{fill:none;stroke:var(--taxi);stroke-width:7;stroke-opacity:.16;stroke-linecap:round;stroke-linejoin:round}
.intro-route{fill:none;stroke:var(--taxi);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.intro-glow,.intro-route{stroke-dasharray:1}
.intro-start{fill:#fff}
.intro-end{fill:var(--taxi)}
.intro-pulse{fill:none;stroke:var(--taxi);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:ip 2.4s ease-out infinite}
@keyframes ip{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.city3d{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}
.city3d.on{opacity:1}
.city3d.fading{z-index:2;pointer-events:none;bottom:auto}
.intro.on3d::before{content:"";position:absolute;inset:0 0 auto;height:30%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(244,150,100,.26),rgba(244,150,100,0));animation:dusk 2.5s 2.8s backwards}
@keyframes dusk{from{opacity:0}}
.intro.city-ghost{position:absolute;left:0;right:0;z-index:6;background:none;overflow:visible;pointer-events:none;flex:none}
.city-ghost::after{transition:opacity .45s}
.city-ghost.go::after{opacity:0}
.city-ghost .intro-copy{animation:none}
.city-ghost .intro-go{visibility:hidden}
.city-ghost .intro-kicker,.city-ghost .intro-sub,.city-ghost .intro-safe{transition:opacity .16s}
.city-ghost.go .intro-kicker,.city-ghost.go .intro-sub,.city-ghost.go .intro-safe{opacity:0}
.city-morph{position:absolute;z-index:6;pointer-events:none;overflow:hidden;display:grid;place-items:center;box-shadow:0 -14px 40px rgba(17,24,39,.1)}
.intro-copy{position:relative;z-index:1;display:flex;flex-direction:column;gap:.55em;padding:0 1.25em calc(1.1em + env(safe-area-inset-bottom,0px));animation:rise .7s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(14px)}}
.intro-kicker{margin:0;font-size:.88em;font-weight:600;color:var(--taxi)}
.intro h2{margin:0;font-weight:700;font-size:2.15em;line-height:1.2;letter-spacing:-.04em}
.intro-sub{margin:0 0 .6em;color:#C2CAD8;font-size:1em;line-height:1.5}
.intro .tx-call.intro-go{background:var(--taxi);color:#111827}
.intro .tx-call.intro-go:hover{background:#F5CE62}
.intro-safe{margin:0;text-align:center;color:#99A3B5;font-size:.82em}

/* ---------- 화면 전체를 차분하게 ---------- */
.prac-banner{background:var(--night)}
.prac-banner>span:not(.logo){font-weight:500}

:root{--spring:cubic-bezier(.32,.72,0,1);--hair:rgba(17,24,39,.1)}
#app{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(31,102,229,.18)}

.cfare,.eta,.trip b,.plate,#clock{font-variant-numeric:tabular-nums}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .22s var(--spring),background-color .2s ease,border-color .2s ease,opacity .2s ease}

.grab::before{width:36px;height:5px;border-radius:3px;background:#C9CDD4}
.sheet.enter>*:not(.grab){animation:lift .44s var(--spring) backwards}
.sheet.enter>*:nth-child(3){animation-delay:.03s}
.sheet.enter>*:nth-child(4){animation-delay:.06s}
.sheet.enter>*:nth-child(n+5){animation-delay:.09s}
@keyframes lift{from{opacity:0;transform:translateY(9px)}}
.foot{border-top:0;box-shadow:0 -.5px 0 var(--hair)}
.coach{box-shadow:0 .5px 0 var(--hair)}
.ft,.note,.receipt,.drv,.pc{box-shadow:inset 0 0 0 .5px var(--hair)}

.intro .tx-call.intro-go{box-shadow:0 10px 26px -10px rgba(239,194,74,.55)}

.modal-in{animation:up .46s var(--spring)}
#noti:not([hidden]){animation:drop .5s var(--spring)}
#toast:not([hidden]){animation:drop .42s var(--spring)}
@keyframes dim{from{background:rgba(20,28,45,0)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.98)}}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

}

const prj = p => ({x:(p.lon-GEO.lon0)*GEO.kx, y:(GEO.lat1-p.lat)*GEO.ky});
const unprj = (x,y) => ({lat:GEO.lat1-y/GEO.ky, lon:GEO.lon0+x/GEO.kx});
function km(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lon-a.lon)*t;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function curve(a,b,bend=0.18,n=32){const A=prj(a),B=prj(b),mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,C={x:mx-dy*bend,y:my+dx*bend};const out=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push(unprj(u*u*A.x+2*u*t*C.x+t*t*B.x,u*u*A.y+2*u*t*C.y+t*t*B.y))}return out}

const PICK_KEEP_KM = 0.15; // 탑승 위치가 경로 출발지에서 이 안이면 받아 둔 도로 경로와 요금을 그대로 써요

const routeData = k => {

};

async function fetchRoute(a,to){ // to는 PLACES의 key예요. 함수도 이 장소들만 받아요
  if(!CONFIG.ROUTE_API) return null;
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),5000);
  try{
    const res=await fetch(`${CONFIG.ROUTE_API}?from=${a.lat.toFixed(3)},${a.lon.toFixed(3)}&to=${to}`,{signal:ctl.signal});
    if(!res.ok) return null;
    const r=await res.json();
    const ok=r&&Array.isArray(r.path)&&r.path.length>1&&r.path.every(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1]))&&r.m>0&&r.s>0&&r.taxi>0;
    return ok?{path:r.path,m:r.m,s:r.s,taxi:r.taxi}:null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

  if(!CONFIG.ROUTE_API||(S.step!=='origin'&&S.step!=='route')||!S.dest||km(S.pick,ROUTES_ORIGIN)<PICK_KEEP_KM||routeData(S.dest)) return;
  const req=++liveReq, at=S.pick, dest=S.dest;

}

  return r && MapCtl.impl===KakaoMap ? [S.pick,...toPts(r.path),PLACES[k]] : curve(S.pick, PLACES[k]);
}
function fareOf(k){ // 받은 경로의 값 → 거리 비율로 조정한 값 → 경기도 중형택시를 본뜬 연습용 계산 순서로 써요
  const r = routeData(k), base = ROUTES[k], P = PLACES[k], ref = km(ROUTES_ORIGIN,P);
  if(r) return {f:r.taxi, min:Math.max(1,Math.round(r.s/60)), km:(r.m/1000).toFixed(1)};
  // 핀을 조금 옮긴 경우: 받아 둔 경로를 거리 비율로 늘이거나 줄여요. 그래야 멀어졌는데 요금이 내려가지 않아요
  if(base && ref>0.01 && km(S.pick,ROUTES_ORIGIN)<=MAX_PICK_KM+PICK_KEEP_KM){

  }
  const road = km(S.pick,P)*1.35;
  return {f:4800+Math.max(0,Math.ceil((road-1.6)*1000/131))*100, min:Math.max(3,Math.round(road/0.4)+2), km:road.toFixed(1)};
}

/* =====================================================================
   8. 지도 — 카카오맵 / 그림 지도(SVG) 두 가지를 같은 방식으로 다뤄요
      show(view)  단계가 바뀔 때 표시를 새로 그림
      refit()     크기가 바뀌었을 때 화면 맞추기
      moveCar(p)  움직이는 택시 위치 바꾸기
   ===================================================================== */
const SvgMap = {
  name:'svg', el:null, view:null, carPos:null, k:1,
  init(el){ this.el=el; return Promise.resolve(); },
  show(v){ this.view=v; this.carPos=v.car?(v.carAt||v.at):null; this.draw(); },
  pickBox(){ // 탑승 위치를 고를 때는 그 위치가 정확히 지도 가운데에 와요
    const q=prj(S.pick), ar=(this.el.clientWidth||360)/(this.el.clientHeight||300);
    let w=130, h=w/ar; if(h<100){ h=100; w=h*ar; } // 조금 끌어도 잘 맞추도록 가깝게 보여줘요
    return [q.x-w/2, q.y-h/2, w, h];
  },
  refit(){ this.draw(); },
  moveCar(p){ this.carPos=p; const g=this.el.querySelector('#svgcar'); if(g){const q=prj(p); g.setAttribute('transform',`translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${this.k.toFixed(3)})`);} },
  box(points){
    const ps=points.map(prj), xs=ps.map(p=>p.x), ys=ps.map(p=>p.y);
    const ar=(this.el.clientWidth||360)/(this.el.clientHeight||300);
    // 글자·핀 크기가 확대 비율(k)에 따라 커지므로, 여백도 k에 맞춰 두 번 계산해요
    let k=1, box;
    for(let pass=0;pass<3;pass++){
      const x0=Math.min(...xs)-44*k, x1=Math.max(...xs)+44*k, y0=Math.min(...ys)-(this.view&&this.view.bar&&this.el.clientHeight>=BAR_MAP_PX?96:58)*k, y1=Math.max(...ys)+44*k;
      let w=Math.max(x1-x0, ps.length===1?170:230), h=Math.max(y1-y0, ps.length===1?140:190);
      if(w/h<ar) w=h*ar; else h=w/ar;
      const cx=(x0+x1)/2, cy=(y0+y1)/2;
      box=[cx-w/2, cy-h/2, w, h]; k=w/300;
    }
    return box;
  },
  draw(){
    const v=this.view; if(!v) return;
    const vb=this.vb=v.pick?this.pickBox():this.box(v.fit), k=this.k=vb[2]/300, g=[], O=prj(v.at);
    const svgPts=path=>path.map(p=>{const q=prj(p);return [q.x.toFixed(1),q.y.toFixed(1)]});
    const line=(pts,w,c,extra='')=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
    const txt=(t,x,y,s,c='#3E4A56',anchor='middle',w=800)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${(s*k).toFixed(2)}" font-weight="${w}" fill="${c}" text-anchor="${anchor}" paint-order="stroke" stroke="#EEF0E8" stroke-width="${(3*k).toFixed(2)}">${t}</text>`;
    // 바탕
    g.push(`<rect x="-800" y="-800" width="2000" height="2000" fill="#EEF0E8"/>`);
    g.push(`<path d="M150 30 C175 10 240 12 252 45 C262 80 225 98 195 92 C160 86 138 58 150 30Z" fill="#CFE5C1"/>`);
    g.push(`<ellipse cx="200" cy="54" rx="30" ry="17" fill="#BBDDF4" transform="rotate(-18 200 54)"/><ellipse cx="226" cy="18" rx="18" ry="10" fill="#BBDDF4"/>`);
    g.push(`<path d="M200 70 C206 120 186 170 196 220 C204 262 186 300 168 350 C160 375 150 395 140 420" stroke="#BBDDF4" stroke-width="5" fill="none"/>`);
    g.push(`<ellipse cx="190" cy="312" rx="22" ry="14" fill="#D6EACB"/><ellipse cx="300" cy="372" rx="40" ry="24" fill="#D6EACB"/>`);
    [[18,90,50,40],[60,160,40,36],[120,100,46,40],[260,110,60,40],[300,170,46,40],[20,300,60,40],[80,350,50,34],[200,350,50,32],
     [250,250,30,30],[160,280,30,28],[230,190,30,40],[280,280,50,30],[30,200,50,30],[90,290,40,30],[300,60,48,36],[110,30,30,30],[94,232,44,34]]
      .forEach(b=>g.push(`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="6" fill="#E2E5DA"/>`));
    const R=[[[0,376],[146,332],[252,323],[360,329]],[[0,150],[102,225],[210,278],[330,346]],[[276,286],[234,188],[210,90],[186,0]],
             [[0,75],[84,83],[150,68],[260,60],[360,70]],[[0,248],[162,252],[360,256]],[[60,0],[70,120],[60,248],[44,406]]];
    R.forEach(p=>g.push(line(p,9,'#FFFFFF')));
    g.push(line(R[0],3,'#FFE9A8'));
    [['덕영대로',300,322,-3],['봉영로',36,182,37],['영통로',320,251,1],['월드컵로',300,62,4],['광교호수로',228,150,-75]]
      .forEach(([t,x,y,r])=>g.push(`<text x="${x}" y="${y}" font-size="8" fill="#9AA5AF" text-anchor="middle" transform="rotate(${r} ${x} ${y})">${t}</text>`));
    const st=key=>{const p=prj(PLACES[key]);return [p.x,p.y]};
    g.push(line([[-12,212],st('mtst'),st('mpst'),st('ytst'),st('cmst'),[455,216]],5,'#F5A200'));
    g.push(line([st('gjst'),[80,-60]],5,'#D4003B'));
    // 경로
    if(v.approachLine) g.push(line(svgPts(v.approachLine),2.2*k,'#1E2833',`stroke-dasharray="${4*k} ${4*k}" opacity=".55"`));
    if(v.route){const pts=svgPts(v.route);g.push(line(pts,9*k,'#1E2833','opacity=".18"'),line(pts,5.5*k,'#F5B800'))}
    // 장소 이름
    Object.entries(PLACES).forEach(([key,p])=>{ if(key===v.dest) return; const q=prj(p);
      g.push(p.kind==='st'?`<circle cx="${q.x}" cy="${q.y}" r="${4.5*k}" fill="#fff" stroke="${key==='gjst'?'#D4003B':'#F5A200'}" stroke-width="${2.2*k}"/>`:`<circle cx="${q.x}" cy="${q.y}" r="${3*k}" fill="#8A97A4"/>`);
      g.push(txt(p.n,q.x,q.y-7*k,p.kind==='st'?9.5:8.5)); });
    // 호출 중 레이더
    if(v.radar){[0,1].forEach(i=>g.push(`<circle cx="${O.x}" cy="${O.y}" r="${10*k}" fill="rgba(255,210,31,.3)" stroke="#E3AE00" stroke-width="${1.5*k}"><animate attributeName="r" values="${10*k};${70*k}" dur="2s" begin="${i}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" begin="${i}s" repeatCount="indefinite"/></circle>`))}
    // 주변 택시
    if(v.taxis) TAXIS.forEach((p,i)=>{const q=prj(p),dx=(i%2?14:-14)*k,dy=(i%2?6:-5)*k;
      g.push(`<g transform="translate(${q.x} ${q.y})"><animateTransform attributeName="transform" type="translate" values="${q.x} ${q.y};${q.x+dx} ${q.y+dy};${q.x} ${q.y}" dur="${3+i*.7}s" repeatCount="indefinite"/><g transform="scale(${k*.9})">${cabParts()}</g></g>`)});
    // 도착지
    if(v.dest){const q=prj(PLACES[v.dest]);g.push(`<g transform="translate(${q.x} ${q.y}) scale(${k})"><path d="M0 0c-6-7-10-11-10-16a10 10 0 0 1 20 0c0 5-4 9-10 16z" fill="#C8492F" stroke="#fff" stroke-width="1.5"/><circle cy="-16" r="3.6" fill="#fff"/></g>`);g.push(txt(PLACES[v.dest].n,q.x,q.y-31*k,10.5,'#C8492F'))}
    // 탑승 위치
    if(v.origin){g.push(`<circle cx="${O.x}" cy="${O.y}" r="${12*k}" fill="rgba(44,119,186,.18)"><animate attributeName="r" values="${8*k};${15*k};${8*k}" dur="2s" repeatCount="indefinite"/></circle><circle cx="${O.x}" cy="${O.y}" r="${6*k}" fill="#2C77BA" stroke="#fff" stroke-width="${2.4*k}"/>`)}
    // 내 택시
    if(this.carPos){const q=prj(this.carPos);g.push(`<g id="svgcar" transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${k.toFixed(3)})"><g transform="scale(1.25)">${cabParts(myCar().c)}</g></g>`)}
    this.el.innerHTML=`<svg viewBox="${vb.map(n=>n.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g.join('')}</svg>`;
  }
};

const KakaoMap = {
  name:'kakao', el:null, map:null, view:null, ovs:[], lines:[], car:null,
  init(el){
    this.el=el;
    return new Promise((res,rej)=>{
      if(!CONFIG.KAKAO_JS_KEY) return rej(new Error('카카오 키 없음'));
      if(location.protocol==='file:') return rej(new Error('file:// 로 열어서 카카오맵을 쓸 수 없음'));
      let gaveUp=false; // 시간 초과 뒤 늦게 로드돼도 그림 지도 위에 지도를 또 만들지 않게 해요
      const to=setTimeout(()=>{gaveUp=true;rej(new Error('카카오맵 로딩 시간 초과(네트워크·키·도메인 확인)'))}, CONFIG.KAKAO_TIMEOUT_MS);
      const s=document.createElement('script');
      s.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(CONFIG.KAKAO_JS_KEY);
      s.onerror=()=>{clearTimeout(to);rej(new Error('카카오맵 스크립트를 불러오지 못함(키, JavaScript SDK 도메인 등록, 카카오맵 사용 설정 확인)'))};
      s.onload=()=>{
        if(gaveUp) return;
        if(!window.kakao||!kakao.maps){clearTimeout(to);return rej(new Error('kakao.maps 없음(앱 키 인증 실패 가능)'))}
        kakao.maps.load(()=>{ if(gaveUp) return; clearTimeout(to);
          try{ el.classList.add('on-kakao'); this.map=new kakao.maps.Map(el,{center:this.LL(HOME),level:4}); this.listen(); res(); }catch(e){ rej(e); }});
      };
      document.head.appendChild(s);
    });
  },
  LL(p){ return new kakao.maps.LatLng(p.lat,p.lon); },
  listen(){ // 탑승 위치 고르기: 지도를 끌거나 누르면 지도 가운데(핀 끝)가 탑승 위치가 돼요
    const ev=kakao.maps.event; if(!ev) return;
    const lift=on=>{ const p=document.querySelector('.center-pin'); if(p) p.classList.toggle('lift',on); };
    let touched=false; // 프로그램이 지도를 맞출 때는 탑승 위치가 바뀌지 않아요. 사용자가 끌거나 누른 뒤에만 바꿔요
    ev.addListener(this.map,'dragstart',()=>{ touched=true; lift(true); });
    ev.addListener(this.map,'dragend',()=>lift(false));
    ev.addListener(this.map,'click',e=>{ if(this.view&&this.view.pick){ touched=true; this.map.panTo(e.latLng); } });
    ev.addListener(this.map,'zoom_changed',()=>{ if(this.view&&this.view.pick) this.map.setCenter(this.LL(S.pick)); }); // 확대해도 핀 끝 위치는 그대로예요
    ev.addListener(this.map,'idle',()=>{ if(!touched||!this.view||!this.view.pick) return; touched=false; const c=this.map.getCenter(); tryPick({lat:c.getLat(),lon:c.getLng()}); });
  },
  clear(){ this.ovs.forEach(o=>o.setMap(null)); this.lines.forEach(l=>l.setMap(null)); this.ovs=[]; this.lines=[]; this.car=null; },
  add(p,html,yA,z){ const o=new kakao.maps.CustomOverlay({position:this.LL(p),content:html,xAnchor:.5,yAnchor:yA,zIndex:z}); o.setMap(this.map); this.ovs.push(o); return o; },
  line(path,color,w,style='solid',op=1){ const l=new kakao.maps.Polyline({path:path.map(p=>this.LL(p)),strokeWeight:w,strokeColor:color,strokeOpacity:op,strokeStyle:style}); l.setMap(this.map); this.lines.push(l); },
  show(v){
    this.view=v; this.clear();
    this.lock();
    if(v.approachLine) this.line(v.approachLine,'#1E2833',3,'shortdash',.6);
    if(v.route){ this.line(v.route,'#1E2833',10,'solid',.22); this.line(v.route,'#F5B800',6); }
    if(v.radar) this.add(v.at,'<div class="k-radar"><i></i><i></i></div>',.5,1);
    if(v.taxis) TAXIS.forEach((p,i)=>this.add(p,`<div class="k-taxi bob" style="animation-delay:${i*.4}s">${CAB()}</div>`,.5,2));
    if(v.dest){ const d=PLACES[v.dest]; this.add(d,`<div class="k-pin d"><b>${v.bar?`도착 · 약 ${fareOf(v.dest).min}분`:d.n}</b><span></span></div>`,1,5); }
    if(v.bar) this.add(v.at,'<div class="k-tag">출발</div>',1.9,5);
    if(v.origin) this.add(v.at,'<div class="k-dot"></div>',.5,4);
    if(v.car){ this.carAnchor=v.carAt||v.at; this.car=this.add(this.carAnchor,`<div class="k-taxi big">${CAB(myCar().c)}</div>`,.5,6); }
    this.fit();
  },
  fit(){
    const v=this.view; if(!v) return;
    this.map.relayout();
    MapCtl.sizeCls();
    const h=this.el.clientHeight, short=h<SHORT_MAP_PX;
    if(v.pick){ this.map.setCenter(this.LL(S.pick)); this.map.setLevel(3); return; } // 핀 끝이 항상 지도 가운데예요
    if(v.fit.length===1){
      this.map.setLevel(3); this.map.setCenter(this.LL(v.fit[0]));
      // 낮은 지도에서는 핀 끝을 중앙보다 아래에 둬서 핀과 이름표가 위로 잘리지 않게 해요
      const need=(short?34:58)-h/2;
      if(need>0){ const pj=this.map.getProjection(), c=pj.containerPointFromCoords(this.LL(v.fit[0])); this.map.setCenter(pj.coordsFromContainerPoint(new kakao.maps.Point(c.x,c.y-need))); }
      return;
    }
    const b=new kakao.maps.LatLngBounds(); v.fit.forEach(p=>b.extend(this.LL(p)));
    // 위쪽 여백은 핀과 이름표 자리예요. 낮은 지도에서는 이름표를 숨기고(이름은 바로 아래 시트에 있어요) 핀 자리만 남겨요
    this.map.setBounds(b,v.bar&&h>=BAR_MAP_PX?Math.min(96,h*.5):(short?Math.min(38,h*.45):52),32,Math.min(24,h*.12),32); // 출발·도착 줄이 있으면 핀을 가리지 않게 위를 더 비워요
  },
  // 목적지 고르기는 스크롤이 필요 없을 때만, 탑승 위치 고르기는 항상 지도를 움직일 수 있어요.
  // 그 밖에는 내 택시가 화면 밖으로 나가지 않게, 또 지도 위 손가락으로도 화면이 스크롤되게 터치를 지도에 전달하지 않아요
  lock(){
    const v=this.view; if(!v) return;
    // 탑승 위치 고르기는 지도를 움직이는 게 할 일이라서, 화면이 스크롤되더라도 지도를 움직일 수 있어요
    const a=$('area'), free=v.key==='pick'||(v.key==='home'&&a.scrollHeight<=a.clientHeight+1);
    this.map.setDraggable(free); this.map.setZoomable(free); this.el.classList.toggle('locked',!free);
  },
  refit(){ this.lock(); this.fit(); },
  // 지도 크기만 바뀔 때: 보던 중심과 확대 단계를 그대로 둬요
  keep(){ const c=this.map.getCenter(); this.map.relayout(); this.map.setCenter(c); MapCtl.sizeCls(); this.lock(); },
  moveCar(p){
    if(!this.car) return;
    const a=this.carAnchor, el=this.map.getNode().querySelector('.k-taxi.big');
    if(!a||!el){ this.car.setPosition(this.LL(p)); return; }
    const pr=this.map.getProjection(), o=pr.containerPointFromCoords(this.LL(a)), b=pr.containerPointFromCoords(this.LL({lat:a.lat+.02,lon:a.lon+.02}));
    const kx=(b.x-o.x)/.02, ky=(b.y-o.y)/.02;
    el.style.transform=`translate3d(${((p.lon-a.lon)*kx).toFixed(2)}px,${((p.lat-a.lat)*ky).toFixed(2)}px,0)`;
  }
};

const SHORT_MAP_PX = 130; // 지도가 이보다 낮으면 목적지 이름표를 숨기고 핀 자리만 남겨요
const BAR_MAP_PX = 170;   // 지도가 이보다 낮으면 출발·도착 줄을 뒤로 버튼만 남겨서 도착 핀을 가리지 않게 해요. 도착지 이름은 시트에 있어요
const LOW_MAP_PX = 240;   // 지도가 이보다 낮으면 핀 이름표를 숨겨서 출발·도착 줄과 겹치지 않게 해요
const MapCtl = {
  impl:SvgMap, lastKey:null, ready:false, holdUntil:0, el:null,
  sizeCls(){ const h=this.el.clientHeight; this.el.classList.toggle('short',h<SHORT_MAP_PX); this.el.classList.toggle('low',h<LOW_MAP_PX); this.el.classList.toggle('nobar',h<BAR_MAP_PX); },
  hold(){ this.holdUntil=performance.now()+600; }, // 시트를 움직이는 동안은 지도 초점을 그대로 둬요
  async init(el){
    this.el=el;
    try{ await KakaoMap.init(el); this.impl=KakaoMap; TAXIS=makeTaxis(.4); }
    catch(e){ if(CONFIG.KAKAO_JS_KEY) console.warn('[배프] 그림 지도로 바꿨어요:',e.message); el.classList.remove('on-kakao'); el.innerHTML=''; this.impl=SvgMap; await SvgMap.init(el); }
    this.ready=true;
    let t; if(window.ResizeObserver) new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(()=>this.resized(),60)}).observe(el); // 크기가 바뀔 때만 움직여요
  },
  resized(){ // 시트를 움직이거나 사용자가 지도를 옮겨 볼 수 있는 화면이면 보던 곳을 유지하고, 그 밖에는 다시 맞춰요
    this.sizeCls();
    const k=this.impl.view&&this.impl.view.key, held=performance.now()<this.holdUntil||S.sheetDown||k==='pick'||k==='home';
    if(held&&this.impl.keep) this.impl.keep(); else this.impl.refit();
  },
  show(v){
    if(!this.ready) return;
    this.el.classList.toggle('pickable',!!v.pick);
    if(v.key===this.lastKey){ if(this.impl.lock) this.impl.lock(); return; }
    this.sizeCls();
    try{ this.impl.show(v); this.lastKey=v.key; }catch(e){ console.warn('[배프] 지도 표시 오류:',e.message); }
  },
  moveCar(p){ this.impl.moveCar(p); }
};

function viewOf(){
  const st = S.screen==='ride' ? S.step : 'home', d=S.dest, r=d?routePath(d):null, at=S.pick;
  switch(st){
    case 'home':
    case 'search':   return {key:'home', at, origin:1, taxis:1, fit:[at,...TAXIS]};
    case 'route':    return {key:'route'+d, bar:1, at, origin:1, dest:d, route:r, fit:[at,PLACES[d],...r]};
    case 'origin':   return {key:'pick', at:HOME, pick:1, origin:1, taxis:1, fit:[at]};
    case 'calling':  return {key:'calling', at, origin:1, radar:1, taxis:1, fit:[at,...TAXIS]};
    case 'approach': return {key:'approach', at, origin:1, car:1, carAt:S.approach[0], approachLine:S.approach, fit:S.approach};
    case 'plate':    return {key:'plate', at, origin:1, car:1, carAt:at, fit:[at]};
    case 'ride':     return {key:'ride'+d, at, dest:d, route:r, car:1, carAt:r[0], fit:[at,PLACES[d],...r]};
    case 'arrive':   return {key:'arrive'+d, at, dest:d, car:1, carAt:PLACES[d], fit:[PLACES[d]]};
  }
}

/* 탑승 위치: 카카오맵과 그림 지도가 같은 함수로 바꿔요. 위치는 결과에 넣지 않고 옮겼는지만 기록해요 */
let pickReq=0;
const pickLabel = () => km(S.pick,HOME)<0.01 ? `현재 위치 · ${esc(HOME.a)}` : (esc(S.pickName)||'지도에서 고른 곳');
function pickRows(){
  const fr=fareOf(S.dest), m=Math.round(km(S.pick,HOME)*1000);
  return `<div class="ft-r"><i class="dot s"></i><span><small>탑승 위치${m>=10?` · 현재 위치에서 약 ${m}m`:''}</small><b>${pickLabel()}</b></span></div>
    <div class="ft-r extra"><i class="dot n"></i><span><small>예상 요금 · 약 ${fr.km}km</small><b class="tabnum">${won(carFare(fr.f,S.car))}</b></span></div>`;
}
const barFrom=()=>km(S.pick,HOME)<0.01?'현재 위치':'고른 위치';
const setMapLabel=()=>$('map').setAttribute('aria-label',S.dest?`택시 호출 지도. 도착 ${PLACES[S.dest].n}. 출발 ${barFrom()}.`:'택시 호출 지도. 도착지를 아직 고르지 않았어요.');
const showPick=()=>{ const e=$('pick-ft'), f=$('bar-from'); if(e) e.innerHTML=pickRows(); if(f) f.textContent=barFrom(); setMapLabel(); };
function setPick(p){
  if(S.step!=='origin'||km(p,S.pick)<0.003) return; // 지도를 다시 맞출 때 생기는 아주 작은 차이는 옮긴 것으로 보지 않아요
  S.pick={lat:p.lat,lon:p.lon}; S.pickName='';
  S.sk.origin.moved = km(p,HOME)>=0.01 ? 1 : 0; // 현재 위치로 되돌리면 옮기지 않은 것으로 봐요
  const req=++pickReq; showPick(); refreshLive();
  try{
    if(MapCtl.impl!==KakaoMap||!kakao.maps.services) return;
    new kakao.maps.services.Geocoder().coord2Address(p.lon,p.lat,(r,st)=>{
      if(req!==pickReq||st!==kakao.maps.services.Status.OK||!r[0]) return;
      const a=r[0].road_address||r[0].address;
      if(a&&a.address_name){ S.pickName=a.address_name; showPick(); }
    });
  }catch(e){}
}
function tryPick(p){
  if(km(p,HOME)>MAX_PICK_KM){ toast(`탑승 위치는 현재 위치에서 ${MAX_PICK_KM}km 안에서 골라요`); MapCtl.impl.refit(); return false; }
  setPick(p); return true;
}
// 그림 지도에서 탑승 위치 고르기: 끌면 지도가 따라오고, 누르면 그 자리로 옮겨요
let svgDrag=null;
document.addEventListener('pointerdown',e=>{
  if(MapCtl.impl!==SvgMap||!SvgMap.view||!SvgMap.view.pick||svgDrag||!e.target.closest||!e.target.closest('#map')) return;
  svgDrag={id:e.pointerId,x:e.clientX,y:e.clientY,vb:SvgMap.vb,moved:false};
});
document.addEventListener('pointermove',e=>{
  const d=svgDrag; if(!d||e.pointerId!==d.id) return;
  const dx=e.clientX-d.x, dy=e.clientY-d.y; if(!d.moved&&Math.hypot(dx,dy)<6) return;
  d.moved=true; const k=d.vb[2]/(SvgMap.el.clientWidth||1), svg=SvgMap.el.querySelector('svg');
  d.now=[d.vb[0]-dx*k,d.vb[1]-dy*k,d.vb[2],d.vb[3]];
  if(svg) svg.setAttribute('viewBox',d.now.map(n=>n.toFixed(1)).join(' '));
});
function endSvgDrag(e){
  const d=svgDrag; if(!d||e.pointerId!==d.id) return; svgDrag=null;
  if(e.type==='pointerup'&&SvgMap.view&&SvgMap.view.pick){
    if(d.moved) tryPick(unprj(d.now[0]+d.now[2]/2,d.now[1]+d.now[3]/2));
    else { const b=SvgMap.el.getBoundingClientRect(), k=d.vb[2]/(SvgMap.el.clientWidth||1); tryPick(unprj(d.vb[0]+(e.clientX-b.left)*k,d.vb[1]+(e.clientY-b.top)*k)); }
  }
  SvgMap.draw();
}
document.addEventListener('pointerup',endSvgDrag);
document.addEventListener('pointercancel',endSvgDrag);

/* 진행 시계: 안내창이 떠 있거나 화면을 벗어나 있으면 택시 이동, 다음 단계 타이머, 걸린 시간이 모두 멈춰요 */
const flow = {reasons:new Set(), lost:0, at:0};
const flowNow = () => (flow.reasons.size ? flow.at : performance.now()) - flow.lost;
let timers=[];
const armTimer = t => { t.id=setTimeout(()=>{ timers=timers.filter(x=>x!==t); t.fn(); }, Math.max(0,t.due-flowNow())); };
const later=(fn,ms)=>{ const t={fn,due:flowNow()+ms,id:0}; timers.push(t); if(!flow.reasons.size) armTimer(t); };
const clearTimers=()=>{timers.forEach(t=>clearTimeout(t.id));timers=[]};
function pauseFlow(why){ if(flow.reasons.has(why)) return; if(!flow.reasons.size){ flow.at=performance.now(); timers.forEach(t=>clearTimeout(t.id)); } flow.reasons.add(why); }
function resumeFlow(why){ if(!flow.reasons.delete(why)||flow.reasons.size) return; flow.lost+=performance.now()-flow.at; timers.forEach(armTimer); }

/* 경로를 따라 택시 움직이기 */
let animId=0;
function runAlong(path, ms, onTick, onDone){
  const id=++animId, seg=[0];
  for(let i=1;i<path.length;i++) seg.push(seg[i-1]+km(path[i-1],path[i]));
  const total=seg[seg.length-1]||1, t0=flowNow();
  const at=t=>{const d=t*total;let i=1;while(i<seg.length-1&&seg[i]<d)i++;const a=path[i-1],b=path[i],u=(d-seg[i-1])/((seg[i]-seg[i-1])||1);return {lat:a.lat+(b.lat-a.lat)*u,lon:a.lon+(b.lon-a.lon)*u}};
  (function f(){ if(id!==animId) return; if(flow.reasons.size){ requestAnimationFrame(f); return; } const t=Math.max(0,Math.min(1,(flowNow()-t0)/ms)); MapCtl.moveCar(at(t)); onTick&&onTick(t); if(t<1) requestAnimationFrame(f); else onDone&&onDone(); })();
}
const stopAnim=()=>{animId++};

/* =====================================================================
   9. 화면 그리기
   ===================================================================== */
const $=id=>document.getElementById(id);
const quietFocus=el=>{ try{ el.focus({preventScroll:true}); }catch(e){} };
const announce=t=>{ const e=$('sr'); if(!e) return; e.textContent=''; setTimeout(()=>{e.textContent=t},60); }; // 낭독기에 알려요
const guided=()=>S.mode==='practice'?PREF.guide:S.hintOpen;
const tg=c=>guided()&&c?' tgt':'';
const missionShort=()=>S.missionOn?`${PLACES[MISSION_KEY].n}까지 일반택시 부르기`:'가고 싶은 곳까지 택시 부르기';
const missionText=()=>S.missionOn?`우리 집에서 ${PLACES[MISSION_KEY].n}까지 일반택시를 불러 봐요`:'가고 싶은 곳까지 택시를 불러 봐요';

const mmss = () => { const t=Math.max(0,Math.floor((flowNow()-S.t0)/1000)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const helpBtn = () => `<button class="help-btn" data-a="hint" ${S.hintOpen?'disabled':''}>${I('light')+(S.named?(S.hintOpen?'도움 보는 중':'도움 요청'):(S.hintOpen?'힌트 보는 중':'힌트 보기'))}</button>`;
function coachHTML(){
  const st=S.step, sk=SKILL_OF[st], idx=SKILLS.findIndex(x=>x[0]===sk), test=S.mode==='test';
  const showHint = WAIT[st] || guided();
  const tag = test ? (S.named?'<span class="tag test">테스트<span class="tag-more"> · 혼자 해봐요</span></span>':'<span class="tag">연습</span>') : `<span class="tag">연습 모드<span class="tag-more"> · 힌트 ${PREF.guide?'켬':'끔'}</span></span>`;
  const tools = (test ? (WAIT[st]?'':helpBtn()) : `<button class="${PREF.guide?'on':''}" aria-pressed="${!!PREF.guide}" data-a="guide">힌트 ${PREF.guide?'켜짐':'꺼짐'}</button>`)

}

    <div class="res" id="res">${resultsHTML()}</div>`;

function resultsHTML(){
  const norm=s=>s.replace(/\s/g,''), q=norm(S.q.trim());
  const find=w=>NEARBY.filter(([,p])=>!w||norm(p.n+p.a+(p.kw||'')).includes(w));
  // 한글은 쓰는 중에 글자가 완성되지 않아요. 마지막 글자를 빼고 찾아서, 쓰는 동안 "없어요"가 깜빡이지 않게 해요
  let list=find(q), head=q?'검색 결과':'가까운 곳';
  if(!list.length&&q.length>1){ list=find(q.slice(0,-1)); head='비슷한 곳'; }
  if(!list.length&&q.length<=1){ list=find(''); head='가까운 곳'; }
  const items=l=>[...l].sort((a,b)=>fareOf(a[0]).km-fareOf(b[0]).km).map(([k,p])=>`<button class="res-i${tg(S.missionOn&&k===MISSION_KEY&&!!q)}" data-a="pick" data-v="${k}">${I('pin')}<span><b>${p.n}</b><small>${p.a}</small></span><em class="tabnum">${fareOf(k).km}km</em></button>`).join('');
  if(!list.length) return `<div class="empty">"${esc(S.q)}" 검색 결과가 없어요.<br>글자를 다시 확인하거나 마이크로 말해 봐요.</div><div class="res-h">가까운 곳</div>`+items(find(''));
  return `<div class="res-h">${head}</div>`+items(list);
}

// 시작 화면 장면: 받아 둔 실제 도로 경로로 영통 일대의 길을 그리고, 그 위로 택시가 달려요
function introScene(){
  const d=path=>path.map(([la,lo],i)=>{ const q=prj({lat:la,lon:lo}); return `${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`; }).join(' ');
  const lead=S.missionOn?MISSION_KEY:'ajou', main=d(ROUTES[lead].path), end=prj(PLACES[lead]), start=prj(ROUTES_ORIGIN);
  const roads=Object.values(ROUTES).map(r=>`<path d="${d(r.path)}"/>`).join('');
  const dots=Object.values(PLACES).map(q=>{ const c=prj(q); return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="1.6"/>`; }).join('');
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  const car=still?`<g transform="translate(${end.x.toFixed(1)} ${end.y.toFixed(1)}) scale(.62)">${cabParts('#EFC24A')}</g>`
    :`<g><g transform="rotate(90) scale(.62)">${cabParts('#EFC24A')}</g><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.72;1" calcMode="linear" path="${main}"/></g>`;
  const draw=still?'':'<animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.72;1" dur="9s" repeatCount="indefinite"/>';
  return `<svg class="intro-map" viewBox="20 -10 300 400" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <g class="intro-drift">
      <g class="intro-roads">${roads}</g><g class="intro-dots">${dots}</g>
      <path class="intro-glow" d="${main}" pathLength="1">${draw}</path><path class="intro-route" d="${main}" pathLength="1">${draw}</path>
      <circle class="intro-pulse" cx="${end.x.toFixed(1)}" cy="${end.y.toFixed(1)}" r="5"/><circle class="intro-end" cx="${end.x.toFixed(1)}" cy="${end.y.toFixed(1)}" r="3.4"/>
      <circle class="intro-start" cx="${start.x.toFixed(1)}" cy="${start.y.toFixed(1)}" r="3.2"/>
      ${car}
    </g></svg>`;
}

      ratio=Math.min(window.devicePixelRatio||1,2); t=0; last=0; n=0; slow=0; head=head1=at(0)[2]; turnK=1; pos=0; way=1; frozen=false; leaveAt=0; keepTop=0; aAlt=0;
      box.prepend(cv); flat();
      const mine=gl; cv.addEventListener('webglcontextlost',ev=>{ if(gl!==mine) return; ev.preventDefault(); failed=true; stop(); render(); });
      if(still()){ t=40; frozen=true; pos=g.len*.35; head=head1=at(pos)[2]; draw(1); redraw=()=>{ if(gl) draw(1); }; addEventListener('resize',redraw); } // 움직임 줄이기: 다 지어진 한 장면만 보여줘요
      else{ draw(.016); raf=requestAnimationFrame(loop); }

    }catch(err){ failed=true; gl=null; g=null; if(cv) cv.remove(); cv=null; }
  }

})();
