<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>배프 · 택시 부르기 연습</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
==========================================================================
 배프 · 택시 부르기 연습 (단독 페이지)
--------------------------------------------------------------------------
 ■ 팀원이 바꿀 곳: 아래 <script> 맨 위의 CONFIG
     KAKAO_JS_KEY 를 넣으면 카카오맵, 비워두면 그림 지도(SVG)로 동작해요.
     카카오맵을 쓰려면 카카오 개발자 콘솔에서
       ① 앱의 카카오맵 API 활성화
       ② JavaScript 키의 'JavaScript SDK 도메인'에 이 페이지 주소 등록
          (예: http://127.0.0.1:5500 — 포트까지 정확히)
     파일을 더블클릭(file://)으로 열면 카카오맵은 뜨지 않고 그림 지도로 바뀌어요.

 ■ 받는 값 (URL 쿼리, 전부 생략 가능)
     mode=practice|test   practice: 힌트를 따라 하는 연습, test: "테스트"로 표시. 없으면 힌트를 골라 보는 기본 연습
     dest=ajou|...        미션 목적지 key(PLACES 참고). 없으면 자유 연습
     home=37.256,127.0665 배움님 집(출발지) 위도,경도. 기본 집에서 20km 밖이면 기본 집으로
     area=영통동 청명마을   출발지 이름
     guide=0              연습 모드에서 도움말 끄고 시작
     voice=1              소리 안내 켜고 시작
     big=1                큰 글씨로 시작
     tutor=김민지          담당 프렌드 이름(결과 문구). 없으면 "담당 프렌드"

 ■ 돌려주는 값 (iframe 부모에게 postMessage. 받는 곳은 CONFIG.PARENT_ORIGIN으로 제한)
     {type:'baepu:practice-result', ...}  끝까지 했을 때와, 중간에 그만뒀을 때(success:false, stuckAt)
     {type:'baepu:practice-share', ...}   배움님이 "자녀에게 공유"에 동의했을 때만
     {type:'baepu:practice-book', ...}    "다음 수업 예약"을 눌렀을 때
     {type:'baepu:practice-exit'}         나가기
     window.onBaepuPracticeResult = fn 을 정의해 두면 result, share, book을 그 함수로도 받아요.
     결과 형식은 buildResult() 함수 참고. 결과 요약은 이 기기에도 저장돼요(집 위치는 넣지 않아요).
==========================================================================
-->
<style>
/* 시안 방향: 밤 도로를 달리는 택시. 깊은 남색과 절제한 금색, 넓은 여백과 얇은 경계선으로 어른스럽게 */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink)}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:1.35em;height:1.35em;flex:none}

/* ---------- 폰 프레임 ---------- */
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding:24px 16px;background-size:22px 22px}
.phone{container-type:size;width:392px;height:min(820px,calc(100vh - 48px));height:min(820px,calc(100dvh - 48px));border:10px solid #1E2833;border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(31,61,96,.35)}
.sb{flex:none;display:flex;justify-content:space-between;align-items:center;padding:.55em 1.6em .3em;font-size:13px;font-weight:700}
.sb i{display:inline-block;width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;vertical-align:-1px}
.sb i::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;border-radius:1px}
#app{flex:1;min-height:0;display:flex;flex-direction:column;font-size:17px;line-height:1.5;position:relative;word-break:keep-all;overflow-wrap:anywhere}
.big #app{font-size:20px}
@media (max-width:760px){
  .stage{height:100%;display:block;padding:0;background:var(--bg)}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .sb{display:none}
}

/* ---------- 연습 배너 + 코치 ---------- */
.prac-banner{flex:none;display:flex;justify-content:space-between;align-items:center;gap:.5em}
.prac-banner .logo{flex:none;align-items:center;gap:.25em;background:rgba(255,255,255,.75);border-radius:10px;padding:.1em .45em}
.prac-banner .logo b{font-family:var(--f-display);font-weight:400;font-size:1.15em;line-height:1}
.prac-banner>span:not(.logo){flex:1;min-width:0}
.prac-banner button{border:0;font-size:.95em;min-width:44px;flex:none}
.coach{flex:none}

.tag{flex:none}

.c-prog i{border-radius:9px}

.c-bars{display:inline-flex;align-items:center}

.c-time{line-height:1.3}
.hint{display:flex;gap:.5em;font-size:.9em}
.hint svg{flex:none;margin-top:.1em}
.hint span{flex:1}
.hint button{border:0;padding:0;display:grid;place-items:center;flex:none}

.coach-tools button:disabled{cursor:default}

.tgt{position:relative;z-index:2}
@keyframes tgt{50%{box-shadow:0 0 0 3px var(--ink),0 0 0 11px rgba(227,174,0,.45)}}

/* ---------- 지도 + 바텀시트 ---------- */
.area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--map);overflow-y:auto;overflow-x:hidden}
.area.lock{overflow:hidden}
.map-wrap{--map-min:clamp(110px,26vh,210px);flex:1 0 var(--map-min);min-height:var(--map-min);position:relative;overflow:hidden}
.big .map-wrap{--map-min:clamp(84px,16vh,180px)}
.foot{flex:none;position:relative;z-index:5}
#map{position:absolute;inset:0}
#map.on-kakao{bottom:18px} /* 시트가 18px 겹쳐요. 카카오 로고·저작권 표시가 가려지지 않게 지도를 그만큼 올려요 */
#map.locked{pointer-events:none} /* 고정 단계: 끌기·더블클릭 확대를 막고 터치는 화면 스크롤로 넘겨요 */
#map.locked a{pointer-events:auto}
#map.short .k-pin b{visibility:hidden} /* 상자 크기를 유지해야 핀 끝이 좌표에서 어긋나지 않아요 */
#map>svg{position:absolute;inset:0;width:100%;height:100%;display:block} /* 그림 지도만. 카카오맵 위 택시 아이콘에는 적용되면 안 돼요 */
.map-ui{position:absolute;inset:0;pointer-events:none;z-index:3}
.map-ui>*{pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sheet:focus,.panel:focus,.hint:focus{outline:none}
/* 키보드로 들어오면 나타나는 핀 옮기기 버튼. 손가락으로는 지도를 끌면 돼요 */
.pin-move{position:absolute;right:.9em;top:.5em;display:flex;gap:4px;opacity:0;pointer-events:none}
.pin-move:focus-within{opacity:1;pointer-events:auto}
.pin-move button{width:44px;height:44px;border:0;border-radius:50%;background:var(--paper);box-shadow:0 3px 10px rgba(30,40,51,.22);font-size:1.1em;font-weight:800;color:var(--ink)}
.fab{position:absolute;border-radius:50%;border:0;display:grid;place-items:center;color:var(--ink)}
.cancel-chip{position:absolute;top:.7em;right:.7em;border:0;border-radius:99px;padding:0 1em;min-height:44px;font-size:.9em;color:var(--ink)}
.route-bar{position:absolute;top:.6em;left:.7em;right:.7em;display:flex;align-items:center;gap:.35em;padding:0 1em 0 .1em;min-height:48px;font-size:.92em}
.route-bar button{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);flex:none}
.route-bar span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-bar .from{flex:0 1 auto}
.route-bar em{font-style:normal}
.route-bar small{margin-right:.1em}
.route-bar i{flex:none;font-style:normal;color:var(--ink-2)}
.route-bar .to{flex:1 1 0}
.fab.loc{right:.7em;bottom:1.9em}
.map-badge{position:absolute;left:.7em;bottom:1.9em;border-radius:99px;padding:.15em .65em;font-size:.68em;font-weight:700;color:var(--ink-2);pointer-events:none}
.sheet{flex:none;background:var(--paper);display:flex;flex-direction:column;position:relative;z-index:4;margin-top:-18px}
/* 손잡이: 끌어서 시트를 내리고 올려요. 눌러도 접히고 펴져요 */
.grab{display:grid;place-items:center;flex:none;height:44px;padding:0;border:0;background:none;touch-action:none;cursor:grab}
.grab::before{content:""}

.sheet.dragging{transition:none;overflow:hidden}
.sheet.dragging .grab{cursor:grabbing}
.sheet.down{overflow:hidden;cursor:pointer}
.sheet h3{margin:0;line-height:1.35}
.muted{color:var(--ink-2)}
.small{font-size:.85em}
.sheet p{margin:0}
.tabnum{font-variant-numeric:tabular-nums}
.note{padding:.65em .85em;font-size:.88em}

.tx-call{border:0;width:100%}

.btn{display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;min-height:3em;padding:.4em 1em;border:0;font-size:1em}

.btn:disabled{cursor:default}
.link{border:0;background:none;text-decoration:underline;text-underline-offset:3px;padding:.3em .6em;font-size:.88em;align-self:center;min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.row3 button{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.55em .2em;font-size:.82em}

/* 출발/도착 */
.ft{display:flex;flex-direction:column;gap:.45em}
.ft-r{display:flex;align-items:center;gap:.6em}
.ft-r small{display:block;color:var(--ink-2);line-height:1.2}

.dot{width:.75em;height:.75em;border-radius:50%;flex:none}

/* 검색 */
.tx-search-wrap{position:relative}
.tx-search{display:flex;align-items:center;gap:.6em;border:0;padding:.8em 3.5em .8em .9em;text-align:left;width:100%}
.tx-search span{flex:1}
.mic-ic{position:absolute;right:.45em;top:50%;transform:translateY(-50%);z-index:3;width:2.75em;height:2.75em;border:0;display:grid;place-items:center}
.res-h{padding:.2em 0 0}
.quick{display:flex;gap:.45em;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:.3em;padding:.4em .75em;font-size:.85em}
.quick svg{width:1.1em;height:1.1em}

/* 전체 화면 패널 (검색·시작·결과) */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.tx-sh{flex:none;display:flex;align-items:center;gap:.4em;padding:.6em .7em}
.tx-sh input{flex:1;min-width:0;font:inherit;font-size:1.05em;border:0;padding:.7em .8em}
.tx-sh input::placeholder{opacity:1}
.ic-btn{width:2.4em;height:2.4em;min-width:44px;min-height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;flex:none}

.mic{width:2.8em;height:2.8em;border:0;display:grid;place-items:center;flex:none}

.listen{flex:none;display:flex;flex-direction:column;align-items:center;gap:.4em;padding:1.1em;text-align:center}
.listen small{color:var(--ink-2)}
.wave{display:flex;gap:4px;height:2.2em;align-items:center}
.wave i{width:6px;border-radius:4px;background:var(--coral);animation:wv .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:.5em}50%{height:2.2em}}
.res{flex:1;overflow-y:auto}
.res .res-h{padding:.8em 1em .3em}
.res-i{display:flex;align-items:center;gap:.7em;width:100%;border:0;background:none;padding:.85em 1em;text-align:left}

.res-i span{flex:1;min-width:0}
.res-i b{display:block;font-size:1.02em}
.res-i small{color:var(--ink-2)}
.res-i em{font-style:normal;color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);padding:2em 1em;line-height:1.6}

/* 차종 */
.cars{display:flex;flex-direction:column}
.car{display:grid;align-items:center;text-align:left}

.car .cname{min-width:0}
.car .cname b{display:block;font-size:1em;line-height:1.25}
.car .cname small{display:block;color:var(--ink-2);line-height:1.25}
.car .cfare{white-space:nowrap;line-height:1.2;text-align:right}
.car .cfare small{display:block;font-weight:700;color:var(--ink-2)}

[data-step=route] .sheet{gap:.45em}
.trip{color:var(--ink-2)}
.trip b{color:var(--ink);font-size:1.08em}
.pick-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6em}
.pick-h span{font-size:.88em;color:var(--ink-2)}
.pick-h span b{color:var(--ink)}
.payrow{border:0;background:none;padding:0;width:100%;min-height:44px;text-align:left;display:flex;align-items:center;gap:.5em;font-size:.85em}
.payrow span{margin-left:auto}

/* 호출 중 / 배차 */
.radar{border-radius:50%;margin:.3em auto;position:relative;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;animation:ring 1.6s infinite}
.radar::after{animation-delay:.8s}
.radar svg{width:2.2em;height:2.2em}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.eta{line-height:1.2}
.eta em{font-style:normal}
.drv{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .7em;padding:.7em .8em}
.drv .av{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;flex:none}
.drv>div{min-width:0}
.drv b{display:block}
.drv small{color:var(--ink-2)}
.plate{display:inline-block;padding:.1em .55em;font-size:1.25em;white-space:nowrap}
.plate.sm{font-size:1em;padding:0 .4em}
.plates{display:flex;flex-direction:column;gap:.45em}
.pc{display:flex;align-items:center;width:100%;min-height:3.1em;text-align:left}

.pc .plate{font-size:1em;padding:0 .35em;flex:none} /* 위에 나온 내 번호판과 같은 크기로 비교해요 */
.pc small{font-size:.85em;color:var(--ink-2);margin-left:auto;text-align:right;line-height:1.25}
.ridebar{overflow:hidden}
.ridebar i{display:block;height:100%;width:0}
.receipt{display:flex;flex-direction:column;gap:.5em;padding:.85em}
.receipt div{display:flex;justify-content:space-between;gap:1em}
.receipt .tot{padding-top:.5em;font-size:1.12em}
.paid{display:inline-flex;align-items:center;gap:.25em;font-size:.85em}

/* 시작 / 결과 */
.pbody{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.pbody>*{flex:none}
.pfoot{flex:none;display:flex;flex-direction:column;gap:.5em}
.result-hd{display:flex;flex-direction:column}
.result-hd h2{margin:0}
.okmark{border-radius:50%;display:grid;place-items:center}

.report{display:flex;flex-direction:column;gap:.3em}
.report p{margin:0;color:var(--ink-2);font-size:.93em}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.r-badge{border-radius:99px;padding:.1em .7em;font-size:.85em;flex:none}

.card{padding:.9em 1em}
.checks{display:flex;flex-direction:column}
.checks>div{display:flex;align-items:center;gap:.6em;font-size:.93em}
.checks span.t{flex:1}
.checks small{display:block;color:var(--ink-2)}
.ck{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;flex:none}
.ck svg{width:1em;height:1em}

/* 알림·토스트·모달 */
/* 알림과 토스트는 배너 바로 아래에 띄워요(위치는 placeMsg). 배너와 조작 영역을 가리지 않고, 터치도 막지 않아요 */
#noti{position:absolute;left:.6em;right:.6em;z-index:20;padding:.65em .9em;display:flex;gap:.65em;align-items:flex-start;font-size:17px;animation:drop .3s ease-out;pointer-events:none}
.big #noti,.big #toast,.big .modal-in{font-size:20px}
#noti .ni{width:2.3em;height:2.3em;flex:none;display:grid;place-items:center}
#noti b{display:block;font-size:.85em;color:var(--ink-2)}
#noti p{margin:0;line-height:1.4}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
#toast{position:absolute;left:.6em;right:.6em;z-index:21;color:#fff;padding:.7em 1em;font-size:17px;text-align:center;line-height:1.4;pointer-events:none}
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.modal-in{background:var(--paper);width:100%;display:flex;flex-direction:column;gap:.8em;font-size:17px}
.modal-in{max-height:100%;overflow-y:auto}
.modal-in h3{margin:0;font-size:1.2em}
.modal-in p{margin:0;color:var(--ink-2)}

/* ---------- 카카오맵 위에 올리는 표시 ---------- */
.k-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff}
.k-tag{color:#fff;font:800 12px var(--f-body);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.big .k-pin b,.big .k-tag{font-size:15px}
.k-pin{display:flex;flex-direction:column;align-items:center;font-family:var(--f-body)}
.k-pin b{background:#fff;margin-bottom:3px;white-space:nowrap}
.k-pin span{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);margin-bottom:6px}

/* 탑승 위치 핀: 지도 가운데에 고정되고 지도가 움직여요. 핀 끝이 지도 중심이에요 */
.map-ui>.center-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none}
.map-ui>.center-pin.lift{transform:translate(-50%,calc(-100% - 8px))}
#map.on-kakao~.map-ui>.center-pin{top:calc(50% - 9px)}
#map.short~.map-ui>.center-pin b{visibility:hidden}
#map.low~.map-ui>.center-pin b,#map.low .k-pin.d b{visibility:hidden}
#map.nobar~.map-ui>.route-bar{right:auto;padding:0;width:48px;justify-content:center}
#map.nobar~.map-ui>.route-bar>span,#map.nobar~.map-ui>.route-bar>i{display:none}
#map.pickable{cursor:grab}
#map.pickable>svg{touch-action:none}
.k-taxi svg{width:24px;height:31px;display:block}
.k-taxi.big svg{width:31px;height:40px}
.k-taxi.big{will-change:transform}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(6px,-3px)}}
.k-radar{width:160px;height:160px;position:relative}
.k-radar i{position:absolute;inset:0;border-radius:50%;animation:kr 2s infinite ease-out}
.k-radar i+i{animation-delay:1s}
@keyframes kr{from{transform:scale(.15);opacity:1}to{transform:scale(1);opacity:0}}

/* ========== 새 디자인 층 (높이별 규칙보다 앞에 둬서 작은 화면 규칙이 그대로 이겨요) ========== */

/* 연습 배너: 언제나 보이는 얇은 어두운 띠 */

.prac-banner .logo{display:none}

/* 위쪽 안내 */
.coach{padding:.75em 1em .7em}

.tag{padding:.12em .5em;margin-top:0}

.c-prog i{flex:1;width:auto;height:4px;background:#E2E5E9}

/* 검색 */
.tx-search,.tx-sh input{background:var(--bg);border-radius:14px;letter-spacing:-.02em}
.tx-search{font-weight:600}
.tx-search span{color:var(--ink-2)}
.tx-sh input{font-weight:500}
.tx-sh input::placeholder{color:var(--ink-2)}
.mic-ic,.mic{background:var(--tint);color:var(--blue);border-radius:50%}
.mic.live{background:var(--coral);color:#fff}
.quick button{border:0;border-radius:999px;background:var(--fill);color:var(--ink);font-weight:600;box-shadow:none}
.quick svg{color:var(--ink-2)}
.res-h{color:var(--ink-2);font-weight:600}
.res-i{position:relative;border-bottom:0}
.res-i+.res-i::before{content:"";position:absolute;right:0;top:0;height:1px;transform:scaleY(.5);background:var(--hair)}
.res-i:hover,.res-i:active{background:var(--fill)}
.res-i>svg{width:1.05em;height:1.05em;padding:.42em;box-sizing:content-box;border-radius:.62em;background:var(--tint);color:var(--blue)}
.res-i b{font-weight:600;letter-spacing:-.022em}
.res-i em{font-weight:500}

/* 택시 고르기: 한 묶음 안의 줄 */
.cars{gap:0;background:var(--bg);border-radius:18px}
.car{position:relative;border:0;border-radius:18px;background:transparent;box-shadow:none}
.car+.car::before{content:"";position:absolute;left:.9em;right:.9em;top:0;height:1px;transform:scaleY(.5);background:var(--hair)}
.car.on::before,.car.on+.car::before{display:none}
.car.on{border:0;background:var(--tint);box-shadow:inset 0 0 0 2px var(--blue)}
.car .cname b{font-weight:600;letter-spacing:-.022em}
.car .cfare{font-weight:700;letter-spacing:-.022em}
.trip{font-weight:500}
.trip b{font-weight:700}

/* 정보 묶음 */
.ft,.receipt,.drv,.pc,.pay-opt,.row3 button{border:0;background:var(--bg);box-shadow:none}
.ft,.receipt,.drv,.pc,.pay-opt,.note{border-radius:16px}
.row3 button{border-radius:16px;color:var(--ink);font-weight:600}
.row3 button svg{color:var(--blue)}
.drv .av{background:var(--sky);color:var(--blue-ink);font-weight:600}
.plate,.plate.sm,.pc .plate{border-color:var(--ink);border-radius:7px;font-weight:700;letter-spacing:.02em}
.pay-opt.on{background:var(--tint);box-shadow:inset 0 0 0 2px var(--blue)}
.eta{font-weight:700;letter-spacing:-.035em}
.eta em{color:var(--blue)}
.radar{background:var(--sky-2);color:var(--blue);box-shadow:none}
.radar::before,.radar::after{border:1px solid rgba(10,114,209,.3)}
.ridebar{height:6px;background:rgba(118,118,128,.18)}
.ridebar i{background:var(--blue)}

/* 결과 */
.result-hd h2{font-weight:700;letter-spacing:-.035em;font-size:1.7em}
.okmark{width:3.6em;height:3.6em;background:var(--ok);color:#fff}
.okmark svg{width:2em;height:2em}
.okmark.retry{background:#FFF0BF;color:#7A5900}
.card{border:0;border-radius:20px;box-shadow:0 .5px 1px rgba(0,0,0,.05)}
.rec-ic{background:var(--tint)!important;color:var(--blue);border-radius:.62em}
.ck.y{background:var(--ok);color:#fff}
.ck.h{background:#FFF0BF;color:#7A5900}
.r-badge{font-weight:600}
.r-badge.solo{background:rgba(31,163,91,.14);color:var(--ok-ink)}
.r-badge.retry{background:#FFF0BF;color:#6B4E00}

/* 알림과 안내창 */
#noti{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:20px;box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.14)}
#noti .ni{background:var(--sky-2);color:var(--blue);border-radius:.7em}
#noti b{font-weight:600}
#noti p{font-weight:600;letter-spacing:-.018em}
#toast{background:rgba(29,29,31,.88);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px)}
#toast.good{background:rgba(15,122,67,.94)}
#toast.mist{background:rgba(122,74,0,.94)}
#modal{background:rgba(0,0,0,.32)}
.modal-in{border-radius:28px 28px 0 0}
.modal-in h3{letter-spacing:-.028em}
@supports (corner-shape:squircle){
  .tx-call,.btn,.ft,.drv,.note,.pc,.receipt,.card,.tx-search,.hint,.pay-opt,.route-bar,#noti,.cars,.car{corner-shape:squircle;border-radius:22px}#toast{corner-shape:squircle}
  .sheet,.modal-in{corner-shape:squircle;border-radius:36px 36px 0 0}
}

/* ---------- 움직임: 빠르게 반응하고, 끊기지 않게 이어지고, 조용히 멈춰요 ----------
   값은 살짝만 넘쳤다 돌아오는 스프링이에요. 움직임 줄이기 설정이면 위쪽 규칙이 모두 꺼요 */
:root{--pop:cubic-bezier(.34,1.3,.64,1)}
@supports (animation-timing-function:linear(0,1)){:root{--spring:linear(0,0.0348,0.118,0.2256,0.3411,0.4541,0.5582,0.6502,0.7289,0.7945,0.8477,0.8901,0.923,0.9481,0.9668,0.9803,0.9899,0.9963,1.0005,1.0031,1.0044,1.005,1.005,1.0047,1.0042,1.0036,1);--pop:linear(0,0.0554,0.1859,0.349,0.5154,0.6667,0.7932,0.8918,0.9631,1.0104,1.0383,1.0514,1.0542,1.0503,1.0428,1.0338,1.0249,1.0169,1.0102,1.0051,1.0015,0.9991,0.9978,0.9972,0.9971,0.9973,1)}}
button{transition:transform .34s var(--spring),background-color .22s ease,color .22s ease,box-shadow .22s ease,opacity .2s ease}
button:not(.grab):active:not(:disabled){transform:scale(.965);transition-duration:.07s}
button.car:active:not(:disabled),button.res-i:active:not(:disabled){transform:scale(.99)}
.car{z-index:1}
.cars{position:relative}
.car-ghost{position:absolute;left:0;right:0;z-index:2;display:block;border-radius:18px;background:var(--tint);box-shadow:inset 0 0 0 2px var(--blue);pointer-events:none}
.car.on.sel-moving{background:transparent;box-shadow:none}
.car.on .cname b::after{display:inline-block}
.panel.same .car.on .cname b::after{animation:none}
@keyframes check-pop{from{transform:scale(.4);opacity:0}}

/* 힌트: 버튼과 내용이 한 덩어리예요 */
.coach-tools .island{grid-column:1;grid-row:1;justify-self:start;min-width:0;border-radius:22px}

.island .help-btn{position:relative}

@container (max-width:340px){
  .coach-tools .island{grid-column:1 / -1}
}

/* 눌러야 할 곳 */
.tgt::after{animation:tgt-float 2.8s ease-in-out .5s infinite}
.mic.tgt::after{animation-name:tgt-float-under}
@keyframes tgt-float{50%{transform:translateY(calc(-62% - 4px))}}
@keyframes tgt-float-under{50%{transform:translateY(12px)}}
#app.tgt-fresh .tgt{animation:tgt-ring .56s var(--spring) backwards}
#app.tgt-fresh .tgt::after{animation:tgt-label .46s var(--pop) backwards,tgt-float 2.8s ease-in-out .6s infinite}
#app.tgt-fresh .mic.tgt::after{animation:tgt-label-under .46s var(--pop) backwards,tgt-float-under 2.8s ease-in-out .6s infinite}
@keyframes tgt-ring{from{box-shadow:0 0 0 0 var(--paper),0 0 0 0 #FFC400,0 0 0 0 rgba(138,97,0,0)}}
@keyframes tgt-label{from{opacity:0;transform:translateY(-20%) scale(.7)}}
@keyframes tgt-label-under{from{opacity:0;transform:translateY(0) scale(.7)}}

/* 화면 전환 */
.area.morph{overflow:hidden}
.sheet.morph::after{content:"";position:absolute;left:0;right:0;top:100%;height:70vh;background:var(--paper)}
.sheet.enter>*:not(.grab){animation:lift .5s var(--spring) backwards}
.sheet.enter>*:nth-child(3){animation-delay:.04s}
.sheet.enter>*:nth-child(4){animation-delay:.08s}
.sheet.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes lift{from{opacity:0;transform:translateY(12px)}}
.panel:not(.same) .pbody>*{animation:lift .56s var(--spring) backwards}
.panel:not(.same) .pbody>*:nth-child(2){animation-delay:.05s}
.panel:not(.same) .pbody>*:nth-child(3){animation-delay:.1s}
.panel:not(.same) .pbody>*:nth-child(n+4){animation-delay:.15s}
.panel:not(.same) .res>*{animation:lift .46s var(--spring) backwards}
.panel:not(.same) .res>*:nth-child(2){animation-delay:.04s}
.panel:not(.same) .res>*:nth-child(3){animation-delay:.07s}
.panel:not(.same) .res>*:nth-child(4){animation-delay:.1s}
.panel:not(.same) .res>*:nth-child(n+5){animation-delay:.13s}
.okmark{animation:pop .62s var(--pop)}
.panel.same .okmark{animation:none}
.okmark.draw svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:check-draw .44s ease-out .24s forwards}
.panel.same .okmark.draw svg *{animation:none;stroke-dashoffset:0}
@keyframes check-draw{to{stroke-dashoffset:0}}
.modal-ghost{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.32);pointer-events:none}
.modal-ghost .modal-in{animation:none}
#toast:not([hidden]){animation:drop .46s var(--spring)}
#noti:not([hidden]){animation:drop .52s var(--spring)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}}

/* 지도 위 */
#map .k-pin{animation:pin-drop .56s var(--pop) backwards}
@keyframes pin-drop{from{opacity:0;transform:translateY(-16px) scale(.86)}}
#map .k-dot{position:relative}
#map .k-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:rgba(10,114,209,.35);animation:dot-halo 2.8s ease-out infinite}
#map.pickable .k-dot::after{animation:none;opacity:0}
@keyframes dot-halo{from{transform:scale(1);opacity:.7}70%,to{transform:scale(3.1);opacity:0}}
.map-ui>.center-pin{transition:transform .34s var(--spring)}
.fab,.route-bar,.cancel-chip{animation:float-in .46s var(--spring) backwards}
.area[data-step=home] .route-bar{animation:none}
@keyframes float-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.fab:active{transform:scale(.92)}
.c-bars i{transition:background-color .3s ease}

/* 큰 화면에서만 지도를 넉넉히 둬요. 낮은 화면은 위쪽의 낮은 화면용 규칙을 그대로 따라요 */
@container (min-height:761px){[data-step=route] .map-wrap{--map-min:clamp(180px,30cqh,300px)}.big [data-step=route] .map-wrap{--map-min:120px}}

/* 안내 위쪽: 연습 표시와 진행 칸을 한 줄로, 제목은 그 아래 넓게 */

/* 안내 글은 낱말 사이를 조금 띄우고, 문장마다 줄을 나눠요 */
.hint span,.note,.sheet p.small,.modal-in p{letter-spacing:-.004em;word-spacing:.07em;line-height:1.55;text-wrap:pretty}

/* 탑승 위치 바꾸기 */
.origin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.origin-actions button{display:inline-flex;align-items:center;justify-content:center;gap:.35em;min-height:48px;padding:.3em .5em;border:0;background:var(--fill);color:var(--ink);font-weight:600;font-size:.95em;letter-spacing:-.018em;white-space:nowrap}
.origin-actions button svg{width:1.15em;height:1.15em;color:var(--blue)}
.origin-actions button:disabled{color:var(--ink-2)}
.res-i.gps-row b{color:var(--blue-ink)}

/* 시트 올림·내림: 높이는 스크립트의 스프링으로 움직이고, 손잡이와 "더 보기" 글자는 서로 번져요 */
.sheet{transition:none}
.sheet.moving{overflow:hidden;will-change:height}
.grab::before,.grab::after{grid-area:1/1;transition:opacity .22s ease}
.grab::after{content:"▲ 더 보기";font-size:.85em;color:var(--ink-2);opacity:0;pointer-events:none}
.sheet.down .grab::before{opacity:0}
.sheet.down .grab::after{opacity:1}

/* ---------- 위쪽 안내 다시 짜기 ----------
   한 줄에 연습 표시 · 제목 · 진행 칸, 그 아래 한 줄에 힌트(또는 기다리는 표시) · 소리 · 글자.
   높이가 단계마다 같아서 지도가 들썩이지 않고, 힌트는 이 영역 위에 카드로 펼쳐져서 아무것도 밀어내지 않아요 */
.coach{position:relative;z-index:6;display:flex;flex-direction:column;flex-wrap:nowrap;gap:.55em}
.c-prog{order:0;flex:none;display:flex;align-items:center;gap:.55em;min-height:1.75em;font-size:1em;line-height:1.3;color:var(--ink)}
.c-prog .tag{flex:none;font-size:max(12.5px,.76em);padding:.18em .68em;line-height:1.35}
.c-title{flex:1 1 auto;min-width:0;font-size:1.02em;font-weight:700;letter-spacing:-.028em;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.c-bars{flex:0 0 66px;max-width:66px;gap:3px;margin-left:auto}
.c-bars i{display:block;flex:1;height:4px;border-radius:2px}
.c-time{flex:none;margin-left:0;font-size:.9em;font-weight:600;color:var(--ink-2)}
.coach-tools{order:0;flex:none}
.wait-chip{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:.6em;min-height:44px;padding:0 1.05em 0 .95em;border-radius:999px;background:var(--sky-2);color:var(--on-tint);font-weight:600;font-size:max(15px,.86em);letter-spacing:-.015em;white-space:nowrap}
.wait-chip .dots{display:inline-flex;gap:3px}
.wait-chip i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:wait-dot 1.3s ease-in-out infinite}
.wait-chip i:nth-child(2){animation-delay:.16s}
.wait-chip i:nth-child(3){animation-delay:.32s}
@keyframes wait-dot{0%,60%,100%{opacity:.28;transform:none}30%{opacity:1;transform:translateY(-2.5px)}}
.hint-card{position:absolute;left:.6em;right:.6em;top:.4em;min-height:calc(100% - .8em);z-index:2;box-sizing:border-box;display:flex;flex-direction:column;gap:.1em;padding:.5em .6em .6em 1em;border-radius:22px;background:#FFF0BF;color:#4A3700;box-shadow:0 0 0 .5px rgba(138,97,0,.2),0 10px 28px rgba(90,60,0,.18);outline:0}
.hint-card.ghost{pointer-events:none}
.hc-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;min-height:32px;font-size:max(13.5px,.8em);font-weight:600;color:#7A5900}
.hc-head>span:first-child{display:inline-flex;align-items:center;gap:.4em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-head>span:first-child svg{flex:none;width:1.3em;height:1.3em;color:#A87600;fill:#FFCE3A}
.hc-acts{flex:none;display:inline-flex;align-items:center}
.hc-acts button{position:relative;display:inline-grid;place-items:center;min-width:32px;min-height:32px;padding:0 .95em;border:0;border-radius:999px;background:rgba(122,89,0,.13);color:#4A3700;font-family:inherit;font-size:1em;font-weight:600}
.hc-acts button[data-a=say]{padding:0;background:rgba(255,255,255,.8);color:#7A5900}
.hc-acts button[data-a=say] svg{width:1.3em;height:1.3em}
.hc-acts button::after{content:"";position:absolute}
.hc-body{flex:1;display:flex;align-items:center;padding-right:.4em}
.hc-body p{flex:1;min-width:0;margin:0;font-size:1em;font-weight:600;line-height:1.46;letter-spacing:-.012em;word-spacing:.06em;word-break:keep-all;text-wrap:pretty}
@container (max-height:640px){.coach{gap:.35em;padding-top:.45em;padding-bottom:.45em}}

/* 지도 위 택시: 그림만 돌리고 그림자는 늘 아래로 져요. 주변 택시는 보는 방향으로 조금씩 움직여요 */
.k-taxi{filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.k-taxi svg{filter:none}
@keyframes bob{50%{transform:translate(var(--bx,6px),var(--by,-3px))}}

/* 번호판 고르기: 비스듬히 본 입체 택시 */
.pc{gap:.75em;padding:.3em 1em .3em .55em}
.pc svg{width:min(4.7em,82px);height:auto;flex:none;filter:drop-shadow(0 .5px .5px rgba(15,23,35,.38))}
.drv>div{flex:1 1 6em}
.pc.tgt::after{left:auto;right:.9em} /* 표시가 택시 그림을 가리지 않게 오른쪽에 둬요 */

/* ---------- 정밀 점검 반영 (2026-11-11): 시각·움직임·접근성·화면 크기 ---------- */
/* 누를 때 제자리에서 눌려요 */
button.mic-ic:active:not(:disabled){transform:translateY(-50%) scale(.94)}
/* 고른 택시의 체크 표시: 이름과 띄우고, 새로 골랐을 때만 튀어요 */
.car.on .cname b::after{content:"✓";margin-left:.3em;animation:none}
.car.on.sel-new .cname b::after{animation:check-pop .4s var(--pop) backwards}
.sheet.enter>.tx-search-wrap{animation:none}
.listen{animation:lift .32s var(--spring) backwards;border-bottom:0;box-shadow:0 .5px 0 var(--hair)}
@media (prefers-reduced-motion:reduce){.wave i{height:55%}}
/* 손잡이가 없는 시트는 위를 조금 띄워요 */
.sheet>h3:first-child{margin-top:.5em}
.sheet>.radar:first-child{margin-top:.7em}
/* 결제 방법 창의 닫기는 선택지처럼 보이지 않게 */
.pay-opts+.btn.ghost{background:none;color:var(--blue)}
/* 작은 글자 크기와 모서리를 한 가지로 */
.res-i small,.res-i em,.car .cname small,.drv small,.listen small{font-size:.85em}
.payrow span{font-size:1em}
.k-pin b,.k-tag{font-size:13.5px}
.pbody>.note{border-radius:20px}
.origin-actions button{border-radius:16px}
@supports (corner-shape:squircle){.origin-actions button,.row3 button,.car-ghost{corner-shape:squircle;border-radius:22px}}
#toast{border-radius:20px;box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.14)}
.res-i+.res-i::before{left:3.74em}
.receipt .tot{border-top:.5px solid var(--hair)}
.dot.s{box-shadow:0 0 0 3px var(--sky)}
.grab::after{font-weight:600}
/* 끝난 일의 버튼은 차분하게 */
.btn:disabled{opacity:1;background:var(--fill);color:var(--ink-2);box-shadow:none}
/* 경계가 또렷하게: 검색칸 테두리, 손잡이, 남은 진행 칸 */
.tx-search,.tx-sh input{box-shadow:inset 0 0 0 1px rgba(60,60,67,.3)}
.grab::before{background:rgba(60,60,67,.45)}
.c-bars i{background:rgba(118,118,128,.32)}
/* 힌트 카드의 버튼은 누르는 자리를 44px로 */
.hc-acts{gap:12px}
.hc-acts button::after{inset:-6px}
/* 힌트 카드가 검색 화면 위에서도 가려지지 않게 */
.panel{z-index:5}
.hint{order:0;flex:none}
/* 출발지 이름이 길어도 도착지 이름이 보이게 */
.route-bar .from{max-width:42%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 화면 가장자리(위 상태 표시줄, 아래 홈 표시)에 닿지 않게 */
.prac-banner{border-top:env(safe-area-inset-top,0px) solid transparent}
.area:has(+ .foot[hidden]) .sheet{border-bottom:env(safe-area-inset-bottom,0px) solid var(--paper)}
.modal-in{border-bottom:env(safe-area-inset-bottom,0px) solid var(--paper)}
/* 좁은 화면과 큰 글씨: 제목은 아랫줄로 내려 잘리지 않게, 기다림 표시는 옆 버튼과 겹치지 않게 */
@container (max-width:340px){.coach-tools .wait-chip{grid-column:1 / -1}.c-prog{flex-wrap:wrap;row-gap:.1em}.c-title{order:1;flex:1 1 100%}}
@container (max-width:420px){.big .c-prog{flex-wrap:wrap;row-gap:.1em}.big .c-title{order:1;flex:1 1 100%}}
@container (min-width:341px) and (max-width:400px){.big .coach-tools>button{padding:.3em .6em}.big .wait-chip{padding:0 .7em}.big .wait-chip .dots{display:none}}
@container (max-width:400px){.big .hc-body p{font-size:.92em}}
@container (max-height:760px){.pc{padding:.15em 1em .15em .55em}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">

<script>
'use strict';
/* 차례 (번호는 아래 구역 제목과 같아요)
   1 설정 CONFIG · 2 장소·경로 데이터 · 3 받는 값(URL) · 4 좌표·경로·요금 계산 · 5 연습 단계와 문구 · 6 상태 S
   7 아이콘과 택시 그림 · 8 지도(SvgMap, KakaoMap, MapCtl, viewOf, 탑승 위치, 현재 위치, 진행 시계, 택시 이동)
   9 화면 그리기(coachHTML, sheetHTML, footHTML, searchHTML, resultHTML, mapUiHTML, Motion, render, 바텀시트)
   10 진행(Mic, setStep, 채점, 결과 전달) · 11 알림·소리 · 12 누르기(A) · 13 시작
   새 기능을 넣을 때: 상태는 fresh()에, 화면은 sheetHTML()·footHTML()의 그 단계에, 버튼 동작은 A에, 단계가 바뀔 때 할 일은 setStep()에 더해요 */
/* =====================================================================
   1. 설정 — 팀원이 바꿀 곳이에요
   ===================================================================== */
const CONFIG = {

  // 브라우저에 노출되는 키라 파일에 둘 수 있고, 등록한 도메인에서만 동작해요. REST 키는 절대 여기에 넣지 마세요.
  KAKAO_JS_KEY: 'fa2e2f82ff225feaa7788ad2e47c0751',
  KAKAO_TIMEOUT_MS: 5000,  // 이 시간 안에 카카오맵이 안 뜨면 그림 지도로 바꿔요
  // 탑승 핀을 옮겼을 때 실제 도로 경로를 받는 주소(cloudflare/route-worker.js). 허용하지 않은 주소에서는 비워 둬서 곡선으로 그려요
  ROUTE_API: /^(baepu-team\.github\.io|127\.0\.0\.1)$/.test(location.hostname) ? 'https://baepu-route.goodkkjung.workers.dev/route' : '', // 주소를 바꾸면 Worker의 ALLOWED_ORIGINS도 함께 바꿔요
  PARENT_ORIGIN: ''        // 결과를 받을 본 서비스 주소(예: https://baepu.kr). 비우면 이 페이지와 같은 주소에만 보내요
};

/* =====================================================================
   2. 장소·경로 데이터
   ===================================================================== */
const PLACES = { // 기본 연습 장소. 실제 검색에서 고른 장소는 세션 안에서만 추가해요
  ajou:{n:'아주대학교병원',a:'원천동 · 종합병원',lat:37.2797,lon:127.0473,kind:'poi',kw:'아주대병원 아주대학병원 아주병원 아주대 병원 응급실'},

  sdc:{n:'삼성전자 디지털시티',a:'매탄동 · 회사',lat:37.2575,lon:127.0510,kind:'poi',kw:'삼성'},

};
const RECENT = ['ytst','lake','mpst']; // "최근 목적지" 칩
const isPlace = k => Object.prototype.hasOwnProperty.call(PLACES,k); // 바깥에서 온 값은 이걸로 확인한 뒤에만 PLACES에서 찾아요

/* 실제 도로 경로. 비어 있거나 그림 지도일 때는 부드러운 곡선으로 그려요.
   채우는 법: python tools/fetch_routes.py 로 받은 tools/baepu-routes.json 내용을 ROUTES에 넣어요.
   REST 키는 이 파일에 넣지 마세요. 형식: ajou:{path:[[위도,경도],...], m:거리(m), s:시간(초), taxi:택시요금(원)} */
const ROUTES_ORIGIN = {lat:37.2560, lon:127.0665}; // 경로를 받은 출발지(집)
const ROUTES = {
  ajou:{path:[[37.255945,127.066333],[37.263299,127.063051],[37.263908,127.062525],[37.266453,127.058469],[37.268039,127.051752],[37.272974,127.053607],[37.274482,127.05396],[37.274721,127.052401],[37.274994,127.051574],[37.275413,127.05105],[37.276844,127.04969],[37.277881,127.047501],[37.279104,127.048343],[37.280095,127.048274],[37.280051,127.047271]],m:3837,s:847,taxi:7600},
  ytst:{path:[[37.255945,127.066333],[37.253835,127.067328],[37.251415,127.071236],[37.251524,127.071336]],m:705,s:166,taxi:4800},
  mpst:{path:[[37.255945,127.066333],[37.253889,127.067271],[37.252318,127.065746],[37.251924,127.064861],[37.251687,127.064537],[37.248472,127.061443],[37.247884,127.061101],[37.246091,127.061145],[37.245898,127.057203],[37.245699,127.057205],[37.24571,127.057374]],m:1700,s:364,taxi:5400},
  cmst:{path:[[37.255945,127.066333],[37.253835,127.067328],[37.251415,127.071236],[37.260004,127.079461],[37.259468,127.078949]],m:1965,s:361,taxi:5700},
  mtst:{path:[[37.255945,127.066333],[37.253889,127.067271],[37.252318,127.065746],[37.251924,127.064861],[37.251687,127.064537],[37.248472,127.061443],[37.247884,127.061101],[37.246091,127.061145],[37.245629,127.05068],[37.251478,127.041803],[37.252282,127.040958],[37.254389,127.039579],[37.253035,127.040442]],m:3810,s:686,taxi:7300},
  gjst:{path:[[37.255945,127.066333],[37.263541,127.06289],[37.263908,127.062525],[37.266338,127.058729],[37.268641,127.049264],[37.270535,127.042779],[37.271268,127.043198],[37.271642,127.04369],[37.273644,127.048423],[37.275387,127.051152],[37.275948,127.051461],[37.27999,127.05212],[37.281201,127.052444],[37.282396,127.053184],[37.285051,127.056218],[37.28712,127.053475],[37.287246,127.053496],[37.289029,127.051094],[37.288983,127.050993],[37.288884,127.050926],[37.288563,127.051359]],m:5722,s:1017,taxi:9100},
  lake:{path:[[37.255945,127.066333],[37.263299,127.063051],[37.263738,127.062719],[37.266338,127.058729],[37.26715,127.05545],[37.270196,127.061252],[37.272059,127.064341],[37.274028,127.066109],[37.279014,127.06757],[37.279584,127.067856],[37.280509,127.068691],[37.281241,127.06999],[37.281653,127.069703],[37.281433,127.069243]],m:3916,s:595,taxi:7100},
  cafe:{path:[[37.255945,127.066333],[37.253889,127.067271],[37.252812,127.069009]],m:438,s:88,taxi:4800},
  sdc:{path:[[37.255945,127.066333],[37.263299,127.063051],[37.263738,127.062719],[37.266338,127.058729],[37.26715,127.05545],[37.266453,127.054004],[37.265584,127.051275],[37.265329,127.05085],[37.265066,127.050639],[37.263015,127.049966],[37.260664,127.048935],[37.260527,127.048734],[37.25832,127.047736],[37.258015,127.04898],[37.257501,127.050069]],m:3201,s:598,taxi:6700},
  khu:{path:[[37.255945,127.066333],[37.253835,127.067328],[37.248782,127.075596],[37.248739,127.075834],[37.248585,127.075734],[37.247612,127.075735],[37.247651,127.078417],[37.24476,127.07861],[37.244538,127.079097],[37.243657,127.079322],[37.243586,127.080642],[37.242532,127.080655],[37.242442,127.081918],[37.241372,127.082156],[37.240119,127.082093],[37.23996,127.082478],[37.239938,127.083199]],m:2749,s:569,taxi:6700}
};

/* =====================================================================
   3. 받는 값 (URL 쿼리)
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); // HTML에 넣는 바깥 값은 모두 이걸 거쳐요
const cleanText = (v,max) => (v||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,max);
const DEFAULT_HOME = ROUTES_ORIGIN; // 기본 집. 받아 둔 도로 경로의 출발지와 같아요
const MAX_HOME_KM = 20; // 연습 장소가 영통구 일대라, 그보다 먼 출발지는 지도와 요금이 맞지 않아요
function parseHome(v){
  const m = /^\s*(\d{1,2}(?:\.\d+)?)\s*,\s*(\d{1,3}(?:\.\d+)?)\s*$/.exec(v||'');
  if(!m) return DEFAULT_HOME;
  const p = {lat:+m[1], lon:+m[2]};
  if(!(p.lat<=90&&p.lon<=180)) return DEFAULT_HOME; // 범위 밖 값은 거리 계산에서 한 바퀴 돌아 통과할 수 있어요
  return km(p,DEFAULT_HOME)<=MAX_HOME_KM ? p : DEFAULT_HOME;
}
const qDest = Q.get('dest');
const PARAMS = {
  mode: Q.get('mode')==='practice' ? 'practice' : 'test', // 기본은 힌트를 골라서 보는 방식이에요(채점은 테스트와 같아요)
  named: Q.get('mode')==='test', // 화면에 "테스트"라고 보여 줄지. 본 서비스나 프렌드가 요청했을 때만 보여요
  mission: isPlace(qDest) ? qDest : null, // 없으면 자유 연습
  home: parseHome(Q.get('home')),
  area: cleanText(Q.get('area'),40) || '영통동 청명마을',
  guide: Q.get('guide')!=='0',
  voice: Q.get('voice')==='1',
  big: Q.get('big')==='1',
  tutor: cleanText(Q.get('tutor'),20),
};
const HOME = {a:PARAMS.area, ...PARAMS.home};
const MISSION_KEY = PARAMS.mission || 'ajou';

/* =====================================================================
   4. 좌표 계산
   ===================================================================== */
const GEO = {lon0:127.033, lat1:37.290, kx:6000, ky:7515}; // 그림 지도용 투영(수원시 영통구 일대)
const prj = p => ({x:(p.lon-GEO.lon0)*GEO.kx, y:(GEO.lat1-p.lat)*GEO.ky});
const unprj = (x,y) => ({lat:GEO.lat1-y/GEO.ky, lon:GEO.lon0+x/GEO.kx});
function km(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lon-a.lon)*t;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function curve(a,b,bend=0.18,n=32){const A=prj(a),B=prj(b),mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,C={x:mx-dy*bend,y:my+dx*bend};const out=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push(unprj(u*u*A.x+2*u*t*C.x+t*t*B.x,u*u*A.y+2*u*t*C.y+t*t*B.y))}return out}
const makeTaxis = (s,at=HOME) => { const c=prj(at); return [[-55,-40],[48,-28],[32,46],[-42,38],[74,8],[-8,-68]].map(([dx,dy])=>unprj(c.x+dx*s,c.y+dy*s)); };
const makeApproach = s => { const P=prj(S.pick); return curve(unprj(P.x-80*s,P.y-62*s), S.pick, 0.22, 28); };
// 경로 서버를 못 쓸 때의 대체 경로예요(받아 둔 망포역 경로를 거꾸로, 없으면 곡선). 평소에는 fetchApproach가 받은 실제 도로로 바꿔요
const roadApproach = () => { const r=routeData('mpst'); return r ? [...toPts(r.path).reverse(),S.pick] : makeApproach(.5); };
const approachPath = () => MapCtl.impl===KakaoMap ? roadApproach() : makeApproach(1); // 배차된 택시가 오는 길
// 그림 지도 기준 값이에요. 실제 지도에서는 MapCtl.init이 주변 택시를 약 400m로 바꿔요
let TAXIS = makeTaxis(1);       // 주변 택시

// 받아 둔 경로는 그 출발지 근처에서만 맞아요. 더 멀리 타면 함수로 받은 경로(S.live)를 쓰고, 없으면 곡선과 조정 요금이에요
const PICK_KEEP_KM = 0.15; // 탑승 위치가 경로 출발지에서 이 안이면 받아 둔 도로 경로와 요금을 그대로 써요
const MAX_PICK_KM = 1;     // 탑승 핀은 기준 위치(현재 위치나 검색한 장소)에서 이만큼까지 옮길 수 있어요
const routeData = k => {
  if(km(S.pick,ROUTES_ORIGIN)<PICK_KEEP_KM&&ROUTES[k]&&ROUTES[k].path) return ROUTES[k];
  return S.live&&S.live.dest===k&&S.live.at===S.pick ? S.live : null; // 그 탑승 위치로 받아 온 경로
};
// 서버 함수로 경로 받기. 실패하면 null이고, 그때는 곡선과 조정 요금으로 그대로 진행해요
const coordText = p => `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`;
// 좌표를 소수 3자리로 줄이면 역 안 선로처럼 도로가 먼 곳에 떨어질 때가 있어요. 그때는 가까운 칸으로 옮겨 다시 받고, 성공한 칸은 기억해요
const roadNudge = new Map();
const nudged = p => roadNudge.get(coordText(p))||coordText(p);
function nearGrid(p){ // p 둘레의 칸을 가까운 순으로 돌려줘요
  const la=Math.round(p.lat*1000), lo=Math.round(p.lon*1000), out=[];
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++) if(i||j) out.push({lat:(la+i)/1000,lon:(lo+j)/1000});
  return out.sort((x,y)=>km(x,p)-km(y,p));
}
async function askRoute(from,to){ // 경로, 도로가 없다는 뜻의 'noroad', 그 밖의 실패는 null이에요
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),5000);
  try{
    const res=await fetch(`${CONFIG.ROUTE_API}?from=${from}&to=${to}`,{signal:ctl.signal});
    if(!res.ok){ if(res.status!==502) return null; const e=await res.json().catch(()=>null); return e&&e.error==='route'?'noroad':null; }
    const r=await res.json();
    const ok=r&&Array.isArray(r.path)&&r.path.length>1&&r.path.every(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1]))&&r.m>0&&r.s>0&&r.taxi>0;
    return ok?{path:r.path,m:r.m,s:r.s,taxi:r.taxi}:null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}
async function fetchRoute(a,to){ // to는 PLACES의 key이거나 {lat,lon} 좌표예요
  if(!CONFIG.ROUTE_API) return null;
  if(typeof to==='string'&&!isPlace(to)) return null;
  const dest=typeof to!=='string'?to:(PLACES[to].dynamic?PLACES[to]:null); // 검색한 장소는 좌표로 보내요
  const from=nudged(a), target=dest?nudged(dest):to;
  let r=await askRoute(from,target);
  if(r!=='noroad') return r;
  const fs=nearGrid(a).slice(0,2).map(coordText), ts=dest?nearGrid(dest).slice(0,2).map(coordText):[];
  const tries=[[fs[0],target],...(ts[0]?[[from,ts[0]]]:[]),[fs[1],target],...(ts[1]?[[from,ts[1]]]:[])];
  for(const [f,g] of tries){
    r=await askRoute(f,g);
    if(r===null) return null;
    if(r!=='noroad'){ if(f!==from) roadNudge.set(coordText(a),f); if(g!==target) roadNudge.set(coordText(dest),g); return r; }
  }
  return null;
}
let liveReq=0, liveDirty=false;
function flushLive(){ // 안내창이나 시트 끌기를 방해하지 않게 기다렸다가, 끝나면 한 번 반영해요
  if(!liveDirty||!$('modal').hidden||sheetDrag) return;
  liveDirty=false;
  if(S.step!=='route'||!S.live) return;
  $('sheet').classList.remove('enter'); render(); announce('예상 요금을 새로 맞췄어요.');
}
function refreshLive(){ // 지금 탑승 위치에서 목적지까지의 실제 경로를 받아요. 늦게 온 옛 응답은 버려요
  if(!CONFIG.ROUTE_API||(S.step!=='origin'&&S.step!=='route')||!S.dest||routeData(S.dest)) return;
  const req=++liveReq, at=S.pick, dest=S.dest;
  fetchRoute(at,dest).then(r=>{ if(r&&req===liveReq&&(S.step==='origin'||S.step==='route')&&S.pick===at&&S.dest===dest){ S.live={dest,at,...r}; if(S.step!=='route') showPick(); else { liveDirty=true; flushLive(); } } });

    Object.entries(PLACES).forEach(([key,p])=>{ if(key===v.dest) return; const q=prj(p);
      g.push(p.kind==='st'?`<circle cx="${q.x}" cy="${q.y}" r="${4.5*k}" fill="#fff" stroke="${key==='gjst'?'#D4003B':'#F5A200'}" stroke-width="${2.2*k}"/>`:`<circle cx="${q.x}" cy="${q.y}" r="${3*k}" fill="#8A97A4"/>`);
      g.push(txt(p.n,q.x,q.y-7*k,p.kind==='st'?9.5:8.5)); });
    // 호출 중 레이더
    if(v.radar){[0,1].forEach(i=>g.push(`<circle cx="${O.x}" cy="${O.y}" r="${10*k}" fill="rgba(255,210,31,.3)" stroke="#E3AE00" stroke-width="${1.5*k}"><animate attributeName="r" values="${10*k};${70*k}" dur="2s" begin="${i}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" begin="${i}s" repeatCount="indefinite"/></circle>`))}
    // 주변 택시
    if(v.taxis) TAXIS.forEach((p,i)=>{const q=prj(p),dx=(i%2?14:-14)*k,dy=(i%2?6:-5)*k;
      g.push(`<g transform="translate(${q.x} ${q.y})"><animateTransform attributeName="transform" type="translate" values="${q.x} ${q.y};${q.x+dx} ${q.y+dy};${q.x} ${q.y}" dur="${3+i*.7}s" repeatCount="indefinite"/><g transform="scale(${k*.9}) rotate(${TAXI_HEAD[i%TAXI_HEAD.length]})">${cabParts()}</g></g>`)});
    // 도착지
    if(v.dest){const q=prj(PLACES[v.dest]);g.push(`<g transform="translate(${q.x} ${q.y}) scale(${k})"><path d="M0 0c-6-7-10-11-10-16a10 10 0 0 1 20 0c0 5-4 9-10 16z" fill="#C8492F" stroke="#fff" stroke-width="1.5"/><circle cy="-16" r="3.6" fill="#fff"/></g>`);g.push(txt(esc(PLACES[v.dest].n),q.x,q.y-31*k,10.5,'#C8492F'))}
    // 탑승 위치
    if(v.origin){g.push(`<circle cx="${O.x}" cy="${O.y}" r="${12*k}" fill="rgba(44,119,186,.18)"><animate attributeName="r" values="${8*k};${15*k};${8*k}" dur="2s" repeatCount="indefinite"/></circle><circle cx="${O.x}" cy="${O.y}" r="${6*k}" fill="#2C77BA" stroke="#fff" stroke-width="${2.4*k}"/>`)}
    // 내 택시
    if(this.carPos){const q=prj(this.carPos);g.push(`<g id="svgcar" transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${k.toFixed(3)}) rotate(${this.carHeading||0})"><g transform="scale(1.25)">${cabParts(myCar().c)}</g></g>`)}
    this.el.innerHTML=`<svg viewBox="${vb.map(n=>n.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g.join('')}</svg>`;
  }
};

const KakaoMap = {
  el:null, map:null, view:null, ovs:[], lines:[], car:null,
  init(el){
    this.el=el;
    return new Promise((res,rej)=>{
      if(!CONFIG.KAKAO_JS_KEY) return rej(new Error('카카오 키 없음'));
      if(location.protocol==='file:') return rej(new Error('file:// 로 열어서 카카오맵을 쓸 수 없음'));
      let gaveUp=false; // 시간 초과 뒤 늦게 로드돼도 그림 지도 위에 지도를 또 만들지 않게 해요
      const to=setTimeout(()=>{gaveUp=true;rej(new Error('카카오맵 로딩 시간 초과(네트워크·키·도메인 확인)'))}, CONFIG.KAKAO_TIMEOUT_MS);
      const s=document.createElement('script');
      s.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(CONFIG.KAKAO_JS_KEY);
      s.onerror=()=>{clearTimeout(to);rej(new Error('카카오맵 스크립트를 불러오지 못함(키, JavaScript SDK 도메인 등록, 카카오맵 사용 설정 확인)'))};
      s.onload=()=>{
        if(gaveUp) return;
        if(!window.kakao||!kakao.maps){clearTimeout(to);return rej(new Error('kakao.maps 없음(앱 키 인증 실패 가능)'))}
        kakao.maps.load(()=>{ if(gaveUp) return; clearTimeout(to);
          try{ el.classList.add('on-kakao'); this.map=new kakao.maps.Map(el,{center:this.LL(HOME),level:4}); this.listen(); res(); }catch(e){ rej(e); }});
      };
      document.head.appendChild(s);
    });
  },
  LL(p){ return new kakao.maps.LatLng(p.lat,p.lon); },
  listen(){ // 탑승 위치 고르기: 지도를 끌거나 누르면 지도 가운데(핀 끝)가 탑승 위치가 돼요
    const ev=kakao.maps.event; if(!ev) return;
    const lift=on=>{ const p=document.querySelector('.center-pin'); if(p) p.classList.toggle('lift',on); };
    let touched=false; // 프로그램이 지도를 맞출 때는 탑승 위치가 바뀌지 않아요. 사용자가 끌거나 누른 뒤에만 바꿔요
    ev.addListener(this.map,'dragstart',()=>{ touched=true; lift(true); });
    ev.addListener(this.map,'dragend',()=>lift(false));
    ev.addListener(this.map,'click',e=>{ if(this.view&&this.view.pick){ touched=true; this.map.panTo(e.latLng); } });
    ev.addListener(this.map,'zoom_changed',()=>{ if(this.view&&this.view.pick) this.map.setCenter(this.LL(S.pick)); }); // 확대해도 핀 끝 위치는 그대로예요
    ev.addListener(this.map,'idle',()=>{ if(!touched||!this.view||!this.view.pick) return; touched=false; const c=this.map.getCenter(); tryPick({lat:c.getLat(),lon:c.getLng()}); });
  },
  clear(){ this.ovs.forEach(o=>o.setMap(null)); this.lines.forEach(l=>l.setMap(null)); this.ovs=[]; this.lines=[]; this.car=null; },
  add(p,html,yA,z){ const o=new kakao.maps.CustomOverlay({position:this.LL(p),content:html,xAnchor:.5,yAnchor:yA,zIndex:z}); o.setMap(this.map); this.ovs.push(o); return o; },
  line(path,color,w,style='solid',op=1){ const l=new kakao.maps.Polyline({path:path.map(p=>this.LL(p)),strokeWeight:w,strokeColor:color,strokeOpacity:op,strokeStyle:style}); l.setMap(this.map); this.lines.push(l); },
  show(v){
    this.view=v; this.clear();
    this.carHeading=v.heading!=null?v.heading:samplePath(v.approachLine||v.route||[v.at],0).heading;
    this.lock();
    if(v.approachLine) this.line(v.approachLine,'#1E2833',3,'shortdash',.6);
    if(v.route){ this.line(v.route,'#1E2833',10,'solid',.22); this.line(v.route,'#F5B800',6); }
    if(v.radar) this.add(v.at,'<div class="k-radar"><i></i><i></i></div>',.5,1);
    if(v.taxis) TAXIS.forEach((p,i)=>{ const h=TAXI_HEAD[i%TAXI_HEAD.length], r=h*Math.PI/180; this.add(p,`<div class="k-taxi bob" style="animation-delay:${i*.4}s;--bx:${(Math.sin(r)*6).toFixed(1)}px;--by:${(-Math.cos(r)*6).toFixed(1)}px">${CAB(undefined,h)}</div>`,.5,2); });
    if(v.dest){ const d=PLACES[v.dest]; this.add(d,`<div class="k-pin d"><b>${v.bar?`도착 · 약 ${fareOf(v.dest).min}분`:esc(d.n)}</b><span></span></div>`,1,5); }
    if(v.bar) this.add(v.at,'<div class="k-tag">출발</div>',1.9,5);
    if(v.origin) this.add(v.at,'<div class="k-dot"></div>',.5,4);
    if(v.car){ this.carAnchor=v.carAt||v.at; this.car=this.add(this.carAnchor,`<div class="k-taxi big">${CAB(myCar().c)}</div>`,.5,6); }
    this.fit();
    if(v.car) this.moveCar(this.carAnchor,this.carHeading);
  },
  fit(){
    const v=this.view; if(!v) return;
    this.map.relayout();
    MapCtl.sizeCls();
    const h=this.el.clientHeight, short=h<SHORT_MAP_PX;
    if(v.pick){ this.map.setCenter(this.LL(S.pick)); this.map.setLevel(3); return; } // 핀 끝이 항상 지도 가운데예요
    if(v.fit.length===1){
      this.map.setLevel(3); this.map.setCenter(this.LL(v.fit[0]));
      // 낮은 지도에서는 핀 끝을 중앙보다 아래에 둬서 핀과 이름표가 위로 잘리지 않게 해요
      const need=(short?34:58)-h/2;
      if(need>0){ const pj=this.map.getProjection(), c=pj.containerPointFromCoords(this.LL(v.fit[0])); this.map.setCenter(pj.coordsFromContainerPoint(new kakao.maps.Point(c.x,c.y-need))); }
      return;
    }
    const b=new kakao.maps.LatLngBounds(); v.fit.forEach(p=>b.extend(this.LL(p)));
    // 위쪽 여백은 핀과 이름표 자리예요. 낮은 지도에서는 이름표를 숨기고(이름은 바로 아래 시트에 있어요) 핀 자리만 남겨요
    this.map.setBounds(b,v.bar&&h>=BAR_MAP_PX?Math.min(96,h*.5):(short?Math.min(38,h*.45):52),32,Math.min(24,h*.12),32); // 출발·도착 줄이 있으면 핀을 가리지 않게 위를 더 비워요
  },
  // 목적지 고르기는 스크롤이 필요 없을 때만, 탑승 위치 고르기는 항상 지도를 움직일 수 있어요.
  // 그 밖에는 내 택시가 화면 밖으로 나가지 않게, 또 지도 위 손가락으로도 화면이 스크롤되게 터치를 지도에 전달하지 않아요
  lock(){
    const v=this.view; if(!v) return;
    // 탑승 위치 고르기는 지도를 움직이는 게 할 일이라서, 화면이 스크롤되더라도 지도를 움직일 수 있어요
    const a=$('area'), free=v.key==='pick'||(v.key==='home'&&a.scrollHeight<=a.clientHeight+1);
    this.map.setDraggable(free); this.map.setZoomable(free); this.el.classList.toggle('locked',!free);
  },
  refit(){ this.lock(); this.fit(); },
  // 지도 크기만 바뀔 때: 보던 중심과 확대 단계를 그대로 둬요
  keep(){ const c=this.map.getCenter(); this.map.relayout(); this.map.setCenter(c); MapCtl.sizeCls(); this.lock(); },
  resizeKeep(){ // 시트 때문에 지도 상자 높이만 바뀔 때예요. 탑승 핀은 중심을 유지하고, 그 밖에는 화면에 보이던 자리를 그대로 둬요
    const m=this.map, pick=this.view&&this.view.pick;
    const c=pick?m.getCenter():m.getProjection().coordsFromContainerPoint(new kakao.maps.Point(this.el.clientWidth/2,this.el.clientHeight/2));
    m.relayout(); m.setCenter(c);
  },
  moveCar(p,heading=0){
    this.carHeading=heading;
    if(!this.car) return;
    const a=this.carAnchor, el=this.map.getNode().querySelector('.k-taxi.big');
    if(!a||!el){ this.car.setPosition(this.LL(p)); return; }
    const pr=this.map.getProjection(), o=pr.containerPointFromCoords(this.LL(a)), q=pr.containerPointFromCoords(this.LL(p));
    el.style.transform=`translate3d(${(q.x-o.x).toFixed(2)}px,${(q.y-o.y).toFixed(2)}px,0)`;
    const icon=el.querySelector('svg'); if(icon){ icon.style.transformOrigin='50% 50%'; icon.style.transform=`rotate(${heading}deg)`; }
  }
};

const SHORT_MAP_PX = 130; // 지도가 이보다 낮으면 목적지 이름표를 숨기고 핀 자리만 남겨요
const BAR_MAP_PX = 170;   // 지도가 이보다 낮으면 출발·도착 줄을 뒤로 버튼만 남겨서 도착 핀을 가리지 않게 해요. 도착지 이름은 시트에 있어요
const LOW_MAP_PX = 240;   // 지도가 이보다 낮으면 핀 이름표를 숨겨서 출발·도착 줄과 겹치지 않게 해요
const MapCtl = {
  impl:SvgMap, lastKey:null, ready:false, holdUntil:0, el:null,
  sizeCls(){ const h=this.el.clientHeight; this.el.classList.toggle('short',h<SHORT_MAP_PX); this.el.classList.toggle('low',h<LOW_MAP_PX); this.el.classList.toggle('nobar',h<BAR_MAP_PX); },
  hold(){ this.holdUntil=performance.now()+600; }, // 시트를 움직이는 동안은 지도 초점을 그대로 둬요
  async init(el){
    this.el=el;
    try{ await KakaoMap.init(el); this.impl=KakaoMap; TAXIS=makeTaxis(.4); }
    catch(e){ if(CONFIG.KAKAO_JS_KEY) console.warn('[배프] 그림 지도로 바꿨어요:',e.message); el.classList.remove('on-kakao'); el.innerHTML=''; this.impl=SvgMap; await SvgMap.init(el); }
    this.ready=true;
    let t; if(window.ResizeObserver) new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(()=>this.resized(),60)}).observe(el); // 크기가 바뀔 때만 움직여요
  },
  // 시트가 움직이는 동안 지도 상자를 가장 커질 크기로 한 번만 맞춰요. 드러날 곳을 미리 그려 두어서, 시트가 멈춘 뒤에 지도가 튀지 않아요
  sheetStart(extra){
    if(this.sheetOn||!this.ready||this.impl!==KakaoMap) return;
    const el=this.el; this.sheetOn=true; this.sheetGap=el.parentElement.clientHeight-el.clientHeight;
    el.style.height=(el.clientHeight+extra)+'px'; el.style.bottom='auto';
    KakaoMap.resizeKeep(); this.sheetFollow();
  },
  sheetFollow(){ // 탑승 위치를 고를 때는 핀 끝이 항상 지도 가운데라서, 지도도 핀과 같이 움직여요
    if(!this.sheetOn||!KakaoMap.view||!KakaoMap.view.pick) return;
    const el=this.el; el.style.transform=`translateY(${((el.parentElement.clientHeight-this.sheetGap-el.clientHeight)/2).toFixed(1)}px)`;
  },
  sheetEnd(){
    if(!this.sheetOn) return;
    const el=this.el; this.sheetOn=false; el.style.height=''; el.style.bottom=''; el.style.transform='';
    KakaoMap.resizeKeep(); this.sizeCls(); KakaoMap.lock(); this.hold();
  },
  resized(){ // 시트를 움직이거나 사용자가 지도를 옮겨 볼 수 있는 화면이면 보던 곳을 유지하고, 그 밖에는 다시 맞춰요
    if(this.sheetOn) return; // 시트가 멈추면 sheetEnd가 맞춰요
    this.sizeCls();
    const k=this.impl.view&&this.impl.view.key, held=performance.now()<this.holdUntil||S.sheetDown||k==='pick'||k==='home';
    if(held&&this.impl.keep) this.impl.keep(); else this.impl.refit();
  },
  show(v){
    if(!this.ready) return;
    this.el.classList.toggle('pickable',!!v.pick);
    if(v.key===this.lastKey){ if(this.impl.lock) this.impl.lock(); return; }
    this.sizeCls();
    try{ this.impl.show(v); this.lastKey=v.key; }catch(e){ console.warn('[배프] 지도 표시 오류:',e.message); }
  },
  moveCar(p,heading){ this.impl.moveCar(p,heading); }
};

function viewOf(){
  const st = S.screen==='ride' ? S.step : 'home', d=S.dest, r=d?routePath(d):null, at=S.pick;
  switch(st){
    case 'home':
    case 'search':   return {key:'home', at, origin:1, taxis:1, fit:[at,...TAXIS]};
    case 'route':    return {key:'route'+d, at, dest:d, fit:[PLACES[d]]};
    case 'origin':   return {key:'pick', at:base(), pick:1, origin:1, taxis:1, fit:[at]};
    case 'calling':  return {key:'calling', at, origin:1, radar:1, taxis:1, fit:[at,...TAXIS]};
    case 'approach': return {key:'approach', at, origin:1, car:1, carAt:S.approach[0], approachLine:S.approach, fit:[at,...S.approach]};
    case 'plate':  { const end=S.approach.length?S.approach[S.approach.length-1]:at; return {key:'plate', at, origin:1, car:1, carAt:end, heading:S.carHeading, fit:km(at,end)>.03?[at,end]:[at]}; }
    case 'ride':     return {key:'ride'+d, at, dest:d, route:r, car:1, carAt:r[0], fit:[at,PLACES[d],...r]};
    case 'arrive':   return {key:'arrive'+d, at, dest:d, car:1, carAt:PLACES[d], heading:S.carHeading, fit:[PLACES[d]]};
  }
}

/* 탑승 위치: 카카오맵과 그림 지도가 같은 함수로 바꿔요. 위치는 결과에 넣지 않고 옮겼는지만 기록해요 */
let pickReq=0;
const base = () => S.base||HOME; // 탑승 핀의 기준. 기본은 연습용 집이고, 실제 현재 위치나 검색한 장소로 바꿀 수 있어요
const baseName = () => { const b=base(); return b.kind==='place'?b.n:b.kind==='gps'?'현재 위치':'연습 위치'; }; // 처음 위치는 실제 위치가 아니라서 "연습 위치"라고 불러요
const pickLabel = () => { const b=base(); if(km(S.pick,b)>=0.01) return esc(S.pickName)||'지도에서 고른 곳'; if(b.kind==='place') return esc(b.n); const a=b.a||S.pickName; return `${baseName()}${a?` · ${esc(a)}`:''}`; };
function pickRows(){
  const fr=fareOf(S.dest), m=Math.round(km(S.pick,base())*1000);
  return `<div class="ft-r"><i class="dot s"></i><span><small>탑승 위치${m>=10?` · ${esc(baseName())}에서 약 ${m}m`:''}</small><b>${pickLabel()}</b></span></div>
    <div class="ft-r extra"><i class="dot n"></i><span><small>예상 요금 · 약 ${fr.km}km</small><b class="tabnum">${won(carFare(fr.f,S.car))}</b></span></div>`;
}
const barFrom=()=>km(S.pick,base())<0.01?baseName():'고른 곳';
const setMapLabel=()=>$('map').setAttribute('aria-label',S.dest?`택시 호출 지도. 도착 ${PLACES[S.dest].n}. 출발 ${barFrom()}.`:'택시 호출 지도. 도착지를 아직 고르지 않았어요.');
const showPick=()=>{ const e=$('pick-ft'), f=$('bar-from'); if(e) e.innerHTML=pickRows(); if(f){ f.textContent=barFrom(); render.mapUi=mapUiHTML(); } setMapLabel(); };
function setPick(p){
  if(S.step!=='origin'||km(p,S.pick)<0.003) return; // 지도를 다시 맞출 때 생기는 아주 작은 차이는 옮긴 것으로 보지 않아요
  S.pick={lat:p.lat,lon:p.lon}; S.pickName='';
  S.sk.origin.moved = S.base||km(p,HOME)>=0.01 ? 1 : 0; // 처음 위치로 되돌리면 옮기지 않은 것으로 봐요
  const req=++pickReq; showPick(); refreshLive(); namePick(p,req);
}
function namePick(p,req){ // 그 자리의 주소를 받아 탑승 위치 이름으로 보여 줘요. 늦게 온 옛 응답은 버려요
  try{
    if(MapCtl.impl!==KakaoMap||!kakao.maps.services) return;
    new kakao.maps.services.Geocoder().coord2Address(p.lon,p.lat,(r,st)=>{
      if(req!==pickReq||st!==kakao.maps.services.Status.OK||!r[0]) return;
      const a=r[0].road_address||r[0].address;
      if(a&&a.address_name){ S.pickName=a.address_name; showPick(); }
    });
  }catch(e){}
}
const pickRange = () => Math.max(MAX_PICK_KM, Math.min(3, (base().acc||0)/1000+0.5)); // 위치 오차가 크면 핀을 더 멀리 옮길 수 있어요(최대 3km)
function tryPick(p){
  const r=pickRange();
  if(km(p,base())>r){ toast(`${baseName()}에서 ${+r.toFixed(1)}km 안으로 골라요.${canChooseBase()?' 더 먼 곳은 "위치 검색"으로 찾아요':''}`); MapCtl.impl.refit(); return false; }
  setPick(p); return true;
}
// 기준 위치 바꾸기: 실제 현재 위치나 검색한 장소로 옮겨요. 위치 값은 결과에 넣지 않고 옮겼는지만 기록해요
function setBase(b){
  S.base=b; S.pick={lat:b.lat,lon:b.lon}; S.pickName=''; S.live=null; S.sk.origin.moved=1; S.originSearch=false; S.q=''; PlaceSearch.reset();
  TAXIS=makeTaxis(MapCtl.impl===KakaoMap?.4:1,b); MapCtl.lastKey=null;
  const req=++pickReq; render(); refreshLive();
  if(b.kind==='gps') namePick(b,req);
}
const canChooseBase=()=>MapCtl.impl===KakaoMap;
const chooseBase=p=>{ setBase({lat:p.lat,lon:p.lon,n:p.n,kind:'place'}); toast(`${p.n}${eul(p.n)} 탑승 위치로 골랐어요`,'good'); }; // 검색한 장소를 탑승 기준으로
// 위치는 여러 번 받아서 가장 정확한 값을 써요. 휴대폰은 GPS로 보통 수십 m 안이에요.
// 노트북은 Wi-Fi로 짐작해서, 처음 몇 초는 1km쯤 어긋난 값이 오다가 뒤늦게 100m 안팎의 값이 오곤 해요.
// 그래서 쓸 만한 값이 올 때까지 조금 더 기다리고, 어긋난 값으로 맞춘 뒤에도 더 나은 값이 오면 조용히 바꿔요.
// 브라우저에 따라서는 끝까지 어긋난 값만 주기도 해요(2026-11-11 이 노트북의 Whale: 정확도 1km, 실제로 약 1.4km 어긋남)
const GPS_GOOD_M = 30, GPS_OK_M = 150, GPS_WAIT_MS = 2500, GPS_LONG_MS = 5000, GPS_GIVEUP_MS = 14000, GPS_REFINE_MS = 20000;
function gpsErrText(m){ return m>=1000?`${(Math.round(m/100)/10).toFixed(1).replace(/\.0$/,'')}km`:`${Math.max(10,Math.round(m/10)*10)}m`; }
function useGps(){
  if(S.locating) return;
  if(!navigator.geolocation){ toast('이 기기에서는 현재 위치를 확인할 수 없어요'); return; }
  const run=S, open=()=>S===run&&(S.step==='home'||S.step==='origin'), geo=navigator.geolocation, t0=Date.now();
  S.locating=true; render(); toast('현재 위치를 찾고 있어요. 잠깐만 기다려요');
  let best=null, id=null, timer=0, done=false, used=null;
  const stop=()=>{ clearTimeout(timer); if(id!==null){ geo.clearWatch(id); id=null; } };
  const inKorea=g=>g.coords.latitude>=33&&g.coords.latitude<=39&&g.coords.longitude>=124&&g.coords.longitude<=132;
  const apply=g=>{ const acc=Number.isFinite(g.coords.accuracy)?g.coords.accuracy:0; used={lat:g.coords.latitude,lon:g.coords.longitude,kind:'gps',acc}; setBase(used); return acc; };
  const finish=err=>{
    if(done) return; done=true; clearTimeout(timer);
    if(!open()){ stop(); if(S===run) S.locating=false; return; }
    S.locating=false;
    if(!best){ stop(); render(); toast(err&&err.code===1?'현재 위치를 쓸 수 없어요. 탑승 위치는 그대로예요':'현재 위치를 찾지 못했어요. "위치 검색"으로 찾아봐요'); return; }
    if(!inKorea(best)){ stop(); render(); toast('국내에서만 현재 위치를 쓸 수 있어요'); return; }
    const acc=apply(best);
    if(acc<=GPS_OK_M){ stop(); toast('현재 위치로 맞췄어요','good'); return; }
    toast(`이 기기는 위치가 ${gpsErrText(acc)}쯤 어긋날 수 있어요. ${S.step==='origin'?'지도를 끌거나 "위치 검색"으로 맞춰요':'탑승 위치는 다음 화면에서 다시 맞출 수 있어요'}`);
    timer=setTimeout(stop,GPS_REFINE_MS); // 더 나은 값이 오는지 조금 더 지켜봐요
  };
  const better=g=>{ // 어긋난 값으로 맞춘 뒤에 더 정확한 값이 왔어요. 그사이 핀을 옮겼거나 다른 곳을 골랐으면 건드리지 않아요
    if(!open()||S.base!==used||km(S.pick,used)>.005){ stop(); return; }
    if(!inKorea(g)||!(g.coords.accuracy<=GPS_OK_M)) return;
    stop(); apply(g); toast('더 정확한 위치를 찾아서 다시 맞췄어요','good');
  };
  try{
    id=geo.watchPosition(g=>{
      if(done){ if(used) better(g); return; }
      if(!best||g.coords.accuracy<best.coords.accuracy) best=g;
      if(g.coords.accuracy<=GPS_GOOD_M) finish(); // 충분히 정확하면 바로 써요
    },e=>{ if(!done&&(e.code===1||(e.code===2&&!best))) finish(e); },{enableHighAccuracy:true,timeout:GPS_GIVEUP_MS,maximumAge:0});
  }catch(e){ finish(e); return; }
  const check=()=>{ const el=Date.now()-t0;
    if(best&&(best.coords.accuracy<=GPS_OK_M?el>=GPS_WAIT_MS:el>=GPS_LONG_MS)) finish(); // 쓸 만하면 일찍, 어긋나 있으면 더 기다려요
    else if(el>=GPS_GIVEUP_MS) finish({code:3});
    else timer=setTimeout(check,400); };
  timer=setTimeout(check,400);
}
// 그림 지도에서 탑승 위치 고르기: 끌면 지도가 따라오고, 누르면 그 자리로 옮겨요
let svgDrag=null;
document.addEventListener('pointerdown',e=>{
  if(MapCtl.impl!==SvgMap||!SvgMap.view||!SvgMap.view.pick||svgDrag||!e.target.closest||!e.target.closest('#map')) return;
  svgDrag={id:e.pointerId,x:e.clientX,y:e.clientY,vb:SvgMap.vb,moved:false};
});
document.addEventListener('pointermove',e=>{
  const d=svgDrag; if(!d||e.pointerId!==d.id) return;
  const dx=e.clientX-d.x, dy=e.clientY-d.y; if(!d.moved&&Math.hypot(dx,dy)<6) return;
  d.moved=true; const k=d.vb[2]/(SvgMap.el.clientWidth||1), svg=SvgMap.el.querySelector('svg');
  d.now=[d.vb[0]-dx*k,d.vb[1]-dy*k,d.vb[2],d.vb[3]];
  if(svg) svg.setAttribute('viewBox',d.now.map(n=>n.toFixed(1)).join(' '));
});
function endSvgDrag(e){
  const d=svgDrag; if(!d||e.pointerId!==d.id) return; svgDrag=null;
  if(e.type==='pointerup'&&SvgMap.view&&SvgMap.view.pick){
    if(d.moved) tryPick(unprj(d.now[0]+d.now[2]/2,d.now[1]+d.now[3]/2));
    else { const b=SvgMap.el.getBoundingClientRect(), k=d.vb[2]/(SvgMap.el.clientWidth||1); tryPick(unprj(d.vb[0]+(e.clientX-b.left)*k,d.vb[1]+(e.clientY-b.top)*k)); }
  }
  SvgMap.draw();
}
document.addEventListener('pointerup',endSvgDrag);
document.addEventListener('pointercancel',endSvgDrag);

/* 진행 시계: 안내창이 떠 있거나 화면을 벗어나 있으면 택시 이동, 다음 단계 타이머, 걸린 시간이 모두 멈춰요 */
const flow = {reasons:new Set(), lost:0, at:0};
const flowNow = () => (flow.reasons.size ? flow.at : performance.now()) - flow.lost;
let timers=[];
const armTimer = t => { t.id=setTimeout(()=>{ timers=timers.filter(x=>x!==t); t.fn(); }, Math.max(0,t.due-flowNow())); };
const later=(fn,ms)=>{ const t={fn,due:flowNow()+ms,id:0}; timers.push(t); if(!flow.reasons.size) armTimer(t); };
const clearTimers=()=>{timers.forEach(t=>clearTimeout(t.id));timers=[]};
function pauseFlow(why){ if(flow.reasons.has(why)) return; if(!flow.reasons.size){ flow.at=performance.now(); timers.forEach(t=>clearTimeout(t.id)); } flow.reasons.add(why); }
function resumeFlow(why){ if(!flow.reasons.delete(why)||flow.reasons.size) return; flow.lost+=performance.now()-flow.at; timers.forEach(armTimer); }

/* 경로를 따라 택시 움직이기 */
let animId=0;
function taxiHeading(a,b){
  if(!a||!b) return 0;
  const east=(b.lon-a.lon)*Math.cos((a.lat+b.lat)*Math.PI/360), north=b.lat-a.lat;
  return Math.atan2(east,north)*180/Math.PI;
}
// 방향은 지나온 곳과 갈 곳을 함께 보고 정해서, 꺾이는 곳에서 툭 돌지 않고 부드럽게 돌아요
function makeTrack(path){
  const pts=path.filter((q,i)=>!i||km(path[i-1],q)>1e-8), seg=[0];
  for(let i=1;i<pts.length;i++) seg.push(seg[i-1]+km(pts[i-1],pts[i]));
  const total=seg[seg.length-1]||0, win=Math.max(total*.012,.012); // 앞뒤로 이만큼(km) 떨어진 두 점을 이은 방향이에요
  const at=d=>{
    if(pts.length<2) return pts[0]||path[0];
    d=Math.max(0,Math.min(total,d)); let lo=1, hi=seg.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(seg[mid]<d) lo=mid+1; else hi=mid; }
    const a=pts[lo-1], b=pts[lo], u=(d-seg[lo-1])/((seg[lo]-seg[lo-1])||1);
    return {lat:a.lat+(b.lat-a.lat)*u,lon:a.lon+(b.lon-a.lon)*u};
  };
  return {pose(t){ const d=Math.max(0,Math.min(1,t))*total; return {p:at(d),heading:total?taxiHeading(at(d-win),at(d+win)):0}; }};
}
const samplePath=(path,t)=>makeTrack(path).pose(t);
function runAlong(path, ms, onTick, onDone){
  const id=++animId, t0=flowNow(), track=makeTrack(path);
  (function f(){ if(id!==animId) return; if(flow.reasons.size){ requestAnimationFrame(f); return; }
    const t=Math.max(0,Math.min(1,(flowNow()-t0)/ms)), pose=track.pose(t*t*(3-2*t));
    if(pose.p){ S.carHeading=pose.heading; MapCtl.moveCar(pose.p,pose.heading); } // 멈춘 뒤에도 오던 방향을 그대로 봐요
    onTick&&onTick(t); if(t<1) requestAnimationFrame(f); else onDone&&onDone(); })();
}
const stopAnim=()=>{animId++};

  }

}

// 카카오 장소 검색. 이전 검색의 늦은 응답이 최신 목록을 덮지 않게 해요.
const searching=()=>S.step==='search'||S.originSearch;
const placeNorm=s=>String(s).normalize('NFKD').replace(/\s/g,'').toLowerCase();
const placeMatches=(p,q)=>placeNorm(p.n+' '+p.a).includes(placeNorm(q));
const PlaceSearch = {
  query:'', items:[], status:'idle', id:0, timer:0, timeout:0, cache:new Map(), known:new Map(),
  reset(){ clearTimeout(this.timer); clearTimeout(this.timeout); this.id++; this.query=''; this.items=[]; this.status='idle'; },
  remember(items){ items.forEach(p=>this.known.set(p.id,p)); while(this.known.size>150) this.known.delete(this.known.keys().next().value); }, // 다음 입력 때 바로 보여 주려고 기억해요
  item(id){ return this.query===S.q.trim() ? this.items.find(p=>p.id===id) : undefined; }, // 지금 보이는 목록에서 고른 장소
  update(){
    if(!searching()||!$('res')) return;
    if(render.resFresh) render.resFresh=false; else $('panel').classList.add('same'); // 처음 열릴 때만 떠오르고, 글자를 칠 때는 그대로 바뀌어요
    $('res').innerHTML=resultsHTML();
  },
  schedule(){
    const queryText=S.q.trim();
    if(this.query===queryText&&(this.status==='loading'||this.status==='ready'||this.status==='empty')) return;
    this.reset(); this.query=queryText;
    if(!this.query){ this.update(); return; }
    const cacheKey=this.query+'|'+S.pick.lat+','+S.pick.lon;
    if(this.cache.has(cacheKey)){ const hit=this.cache.get(cacheKey); this.items=hit.items; this.status=hit.status; this.update(); return; }
    this.items=[...this.known.values()].filter(p=>placeMatches(p,this.query)).slice(0,15);
    this.status='loading'; this.update();
    const id=this.id, query=this.query;
    this.timer=setTimeout(()=>{
      const finish=(items,status)=>{
        if(id!==this.id||!searching()||S.q.trim()!==query) return;
        clearTimeout(this.timeout);
        const matches=[...this.known.values()].filter(p=>placeMatches(p,query));
        items=[...new Map([...items,...matches].map(p=>[p.id,p])).values()].slice(0,15);
        if(status==='empty'&&items.length) status='ready';
        if(status!=='error'&&items.length){
          this.cache.set(cacheKey,{items,status});
          if(this.cache.size>40) this.cache.delete(this.cache.keys().next().value);
          this.remember(items);
        }
        this.items=items; this.status=status; this.update();
        announce(status==='error'?'지금은 장소를 찾지 못했어요.':this.items.length?`${this.items.length}곳을 찾았어요.`:'찾은 곳이 없어요.');
      };
      if(!window.kakao?.maps?.services){ finish([],'error'); return; }
      this.timeout=setTimeout(()=>{ finish([],'error'); this.id++; },6000);
      try{
        const service=new kakao.maps.services.Places();
        const search=(keyword,fallback=false)=>service.keywordSearch(keyword,(rows,status)=>{
          if(id!==this.id||!searching()||S.q.trim()!==query) return;
          if(status===kakao.maps.services.Status.ZERO_RESULT){
            const short=[...query.replace(/\s/g,'')].slice(0,2).join('');
            if(!fallback&&short.length===2&&short!==query){ search(short,true); return; }
            finish([],'empty'); return;
          }
          if(status!==kakao.maps.services.Status.OK){ finish([],'error'); return; }
          let items=rows.map(p=>({id:String(p.id),n:String(p.place_name||''),a:String(p.road_address_name||p.address_name||''),lat:Number(p.y),lon:Number(p.x),kind:'place',dynamic:true}))
            .filter(p=>/^\d+$/.test(p.id)&&p.n&&Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&p.lat>=33&&p.lat<=39&&p.lon>=124&&p.lon<=132);
          this.remember(items);
          if(fallback) items=items.filter(p=>placeMatches(p,query));
          finish(items,items.length?'ready':'empty');
        },{location:new kakao.maps.LatLng(S.pick.lat,S.pick.lon),size:15});
        search(query);
      }catch(e){ finish([],'error'); }
    },100);
  }
};
function resultsHTML(){
  const norm=placeNorm, q=norm(S.q.trim());
  const local=NEARBY.filter(([,p])=>!q||norm(p.n+p.a+(p.kw||'')).includes(q));
  const row=(p,action,key)=>`<button class="res-i" data-a="${action}" data-v="${key}">${I('pin')}<span><b>${esc(p.n)}</b><small>${esc(p.a)}</small></span><em class="tabnum">${km(S.pick,p).toFixed(1)}km</em></button>`;
  const pickAct=S.originSearch?'origin-local':'pick', placeAct=S.originSearch?'origin-place':'pick-place';
  const gps=S.originSearch&&!q?`<button class="res-i gps-row" data-a="use-gps">${I('loc')}<span><b>현재 위치로</b><small>이 기기의 위치를 사용해요</small></span></button>`:'';
  if(!q) return gps+'<div class="res-h">가까운 곳</div>'+local.map(([k,p])=>row(p,pickAct,k)).join('');
  const current=PlaceSearch.query===S.q.trim(), status=current?PlaceSearch.status:'loading';
  const remote=current?PlaceSearch.items:[];
  const seen=new Set(remote.map(p=>norm(p.n)));
  const list=remote.map(p=>row(p,placeAct,p.id)).join('')+local.filter(([,p])=>!seen.has(norm(p.n))).map(([k,p])=>row(p,pickAct,k)).join('');
  const msg=status==='loading'?'장소를 찾고 있어요…':status==='error'?'지금은 장소를 찾지 못했어요. 조금 뒤에 다시 써 봐요.':!list?'찾은 곳이 없어요. 동네 이름을 함께 써 봐요.':'';
  return '<div class="res-h">찾은 곳 · 오른쪽은 여기서부터의 거리예요</div>'+ (msg?`<div class="${list?'res-h':'empty'}" role="status">${msg}</div>`:'')+list;
}

  const who = PARAMS.tutor ? `${esc(PARAMS.tutor)} 프렌드` : '담당 프렌드', host = hasHost();

/* 화면 전환의 움직임. 화면은 통째로 다시 그려지므로, 그리기 전 위치를 기억했다가 새 위치까지 이어 줘요.
   움직임 줄이기 설정이거나 지원하지 않는 기기에서는 아무것도 하지 않고, 여기서 난 오류가 흐름을 막지 않아요 */
const Motion = {
  soft:'linear(0,0.0348,0.118,0.2256,0.3411,0.4541,0.5582,0.6502,0.7289,0.7945,0.8477,0.8901,0.923,0.9481,0.9668,0.9803,0.9899,0.9963,1.0005,1.0031,1.0044,1.005,1.005,1.0047,1.0042,1.0036,1)',
  ok(){ try{ return !!Element.prototype.animate && !matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){ return false; } },
  ease(){ try{ return CSS.supports('animation-timing-function','linear(0,1)') ? this.soft : 'cubic-bezier(.32,.72,0,1)'; }catch(e){ return 'ease-out'; } },
  play(el,frames,o){ if(!el||!this.ok()) return null; try{ return el.animate(frames,Object.assign({duration:480,easing:this.ease()},o)); }catch(e){ return null; } },
  done(a,fn){ if(a){ a.onfinish=fn; a.oncancel=fn; } else fn(); },
  before(){
    try{
      if(!this.ok()) return null;
      const box=s=>{ const el=document.querySelector(s); return el?el.getBoundingClientRect():null; };
      const pill=document.querySelector('#coach .help-btn'), card=$('hint-card'), sel=document.querySelector('#sheet .car.on'), bars=[...document.querySelectorAll('#coach .c-bars i')];
      return {key:render.key, pill:pill?pill.getBoundingClientRect():null, card:card?card.innerHTML:null, sheetTop:$('sheet').firstElementChild?$('sheet').getBoundingClientRect().top:null,
        search:box('#sheet .tx-search'), field:box('#q'), car:sel?sel.getBoundingClientRect():null, carV:sel?sel.dataset.v:null, bar:bars.findIndex(b=>b.classList.contains('on'))};
    }catch(e){ return null; }
  },
  after(p){ try{ if(p) this.run(p); }catch(e){} },
  run(p){
    const key=render.key, changed=p.key!==key, panelOpen=!$('panel').hidden, app=$('app');
    // 힌트: 버튼 자리에서 카드가 펼쳐지고, 닫을 때는 그 자리로 접혀요. 다른 것은 움직이지 않아요
    const card=$('hint-card'), pill=document.querySelector('#coach .help-btn'), full='inset(-30px -30px -30px -30px round 52px)';
    const clip=(b,r)=>`inset(${(b.top-r.top).toFixed(1)}px ${(r.right-b.right).toFixed(1)}px ${(r.bottom-b.bottom).toFixed(1)}px ${(b.left-r.left).toFixed(1)}px round ${(b.height/2).toFixed(1)}px)`;
    if(card&&!p.card&&p.pill){
      this.play(card,[{clipPath:clip(p.pill,card.getBoundingClientRect())},{clipPath:full}],{duration:520});
      [...card.children].forEach((el,i)=>this.play(el,[{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:300,delay:110+i*50,easing:'ease-out',fill:'backwards'}));
    }
    if(!card&&p.card&&!$('coach').hidden){
      const g=document.createElement('div'); g.className='hint-card ghost'; g.setAttribute('aria-hidden','true'); g.inert=true; g.innerHTML=p.card;
      $('coach').appendChild(g);
      const to=pill?clip(pill.getBoundingClientRect(),g.getBoundingClientRect()):'inset(0 0 100% 0 round 22px)';
      const a=this.play(g,[{clipPath:full,opacity:1},{clipPath:to,opacity:1,offset:.78},{clipPath:to,opacity:0}],{duration:pill?400:260,easing:'cubic-bezier(.3,0,.15,1)',fill:'forwards'});
      this.done(a,()=>g.remove());
    }
    // 눌러야 할 곳을 처음 가리킬 때만 등장 움직임을 줘요. 같은 화면을 다시 그릴 때는 되풀이하지 않아요
    const tk=key+'|'+(guided()?1:0);
    if(tk!==this.tgtKey){ this.tgtKey=tk; if(guided()){ app.classList.add('tgt-fresh'); clearTimeout(this.tgtT); this.tgtT=setTimeout(()=>app.classList.remove('tgt-fresh'),800); } else app.classList.remove('tgt-fresh'); }
    // 고른 택시: 표시가 새 줄로 미끄러져요
    const sel=document.querySelector('#sheet .car.on');
    if(!changed&&p.car&&sel&&sel.dataset.v!==p.carV){
      const box=sel.parentNode, g=document.createElement('i'), r=sel.getBoundingClientRect();
      g.className='car-ghost'; g.setAttribute('aria-hidden','true'); g.style.top=sel.offsetTop+'px'; g.style.height=sel.offsetHeight+'px';
      box.appendChild(g); sel.classList.add('sel-moving','sel-new');
      const a=this.play(g,[{transform:`translateY(${p.car.top-r.top}px)`},{transform:'none'}],{duration:420});
      this.done(a,()=>{ g.remove(); sel.classList.remove('sel-moving'); });
    }
    if(!changed) return;
    // 진행 표시: 지금 단계의 칸이 왼쪽부터 차올라요
    const bars=[...document.querySelectorAll('#coach .c-bars i')], idx=bars.findIndex(b=>b.classList.contains('on'));
    if(idx>=0&&idx!==p.bar){ this.play(bars[idx],[{transform:'scaleX(0)',transformOrigin:'left'},{transform:'scaleX(1)',transformOrigin:'left'}],{duration:520}); }
    // 검색칸은 사라졌다 나타나는 대신 제자리에서 옮겨 가요
    if(key==='search'&&p.search){ const f=$('q'), bar=$('panel').querySelector('.tx-sh'); if(f&&bar){ const r=f.getBoundingClientRect(); this.play(bar,[{transform:`translate(${p.search.left-r.left}px,${p.search.top-r.top}px)`},{transform:'none'}],{duration:520}); this.play($('panel'),[{backgroundColor:'rgba(255,255,255,0)'},{backgroundColor:'rgba(255,255,255,1)'}],{duration:260,easing:'ease-out'}); } }
    if(p.key==='search'&&key==='home'&&p.field){ const w=$('sheet').querySelector('.tx-search-wrap'); if(w){ const r=w.getBoundingClientRect(); this.play(w,[{transform:`translate(${p.field.left-r.left}px,${p.field.top-r.top}px)`},{transform:'none'}],{duration:480}); } }
    // 시트: 높이가 끊기지 않고 이전 자리에서 새 자리로 이어져요. 지도 크기에는 영향을 주지 않아요
    const sh=$('sheet'), area=$('area');
    if(!panelOpen&&p.sheetTop!=null&&sh.firstElementChild&&!S.sheetDown&&!sheetDrag){
      const dy=p.sheetTop-sh.getBoundingClientRect().top;
      if(Math.abs(dy)>2&&Math.abs(dy)<700){
        if(this.sheetA){ this.sheetA.onfinish=this.sheetA.oncancel=null; this.sheetA.cancel(); }
        area.classList.add('morph'); sh.classList.add('morph');
        const a=this.play(sh,[{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:560});

  },
  stop(el){ if(el&&el._leave){ const a=el._leave; el._leave=null; a.onfinish=null; a.cancel(); } },
  leave(el){
