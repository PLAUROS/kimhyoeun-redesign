[build]
publish = "."
functions = "netlify/functions"

# 다른 사이트가 이 페이지를 iframe에 넣지 못하게 해요. 본 서비스에 끼워 넣을 때는 frame-ancestors에 그 주소를 더해요
[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "frame-ancestors 'self'; base-uri 'none'; object-src 'none'; form-action 'none'"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), camera=(), microphone=()"
